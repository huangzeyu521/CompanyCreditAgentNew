<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>复核人员定稿审核 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
/* ============== P1-5 复核人员定稿审核工作台
 * 项目组以外人员的"文字审核"专用工作台
 * 依据：《信用评级业务程序指引》第三十四条 ============== */
function renderMain() {
  const tasks = MockData.proofreadingTasks;
  const issues = MockData.proofreadingIssues;
  const cur = tasks.find(t => t.status === '修改中') || tasks[0];
  const curIssues = issues.filter(i => i.task === cur.id);
  return `
    <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
      <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span><strong class="text-ink">数据声明：</strong>复核流程对齐《程序指引》第三十四条；复核问题为 CCASCEA 演示样例。</span>
    </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            复核人员定稿审核工作台
            <span class="text-xs text-muted font-normal ml-2">P1 · 《程序指引》第三十四条</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            按《程序指引》第三十四条："复核后的评级报告，在报告出具前，应由<strong>项目组以外的人员</strong>进行文字审核后方可定稿。"
            本工作台支持<strong>段落级标注 + 问题分类 + 修改追踪 + 复核签字留痕</strong>。
          </p>
        </div>
        <button onclick="askAIProofread()" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded-md hover:opacity-90">AI 助手 · 智能查错</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">本月复核任务</div><div class="num text-2xl font-bold text-brand-600 mt-1">${tasks.length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">已通过</div><div class="num text-2xl font-bold text-success mt-1">${tasks.filter(t=>t.status==='已通过').length}</div></div>
        <div class="border border-border rounded-md p-3 ${tasks.filter(t=>t.status==='修改中').length>0?'bg-warning/5':''}"><div class="text-xs text-warning">修改中</div><div class="num text-2xl font-bold text-warning mt-1">${tasks.filter(t=>t.status==='修改中').length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">本月发现问题</div><div class="num text-2xl font-bold text-brand-700 mt-1">${tasks.reduce((s,t)=>s+t.issues,0)}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">平均处理时长</div><div class="num text-2xl font-bold text-brand-600 mt-1">3.2h</div></div>
      </div>
    </section>

    <!-- 当前复核任务 + 问题清单 -->
    <section class="grid grid-cols-3 gap-5 mb-5">
      <div class="col-span-2 bg-white rounded-lg shadow-card">
        <div class="px-5 py-3 border-b border-border flex items-center justify-between">
          <h3 class="text-sm font-semibold flex items-center gap-2">
            <span class="w-1 h-4 bg-warning rounded"></span>
            当前复核任务 · ${cur.id}
          </h3>
          <span class="text-xs text-muted">${cur.subject}</span>
        </div>
        <div class="p-5">
          <div class="grid grid-cols-3 gap-3 mb-4 text-xs">
            <div><span class="text-muted">关联报告：</span><span class="num">${cur.report}</span></div>
            <div><span class="text-muted">复核人：</span>${cur.proofreader}</div>
            <div><span class="text-muted">阶段：</span>${cur.stage}</div>
          </div>
          <!-- 问题清单 -->
          <div class="text-xs font-semibold mb-2">发现问题清单（${curIssues.length} 项）</div>
          <table class="w-full text-sm">
            <thead><tr class="th text-left">
              <th class="px-3 py-2">编号</th>
              <th class="py-2">章节定位</th>
              <th class="py-2 text-center">严重</th>
              <th class="py-2">问题描述</th>
              <th class="py-2">状态</th>
              <th class="py-2 pr-3 text-right">操作</th>
            </tr></thead>
            <tbody class="divide-y divide-border">
              ${curIssues.map(i => `
                <tr class="hover:bg-bg">
                  <td class="px-3 py-2 num text-[11px]">${i.id}</td>
                  <td class="text-xs">${i.section}</td>
                  <td class="text-center text-xs"><span class="px-1.5 py-0.5 rounded ${i.severity==='高'?'bg-danger/10 text-danger':i.severity==='中'?'bg-warning/10 text-warning':'bg-bg text-muted'}">${i.severity}</span></td>
                  <td class="text-xs leading-snug max-w-md">${i.desc}</td>
                  <td class="text-xs text-muted">${i.status}</td>
                  <td class="text-right pr-3"><button onclick="resolveIssue('${i.id}')" class="text-xs text-brand-600 hover:underline">处理 →</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-card p-5">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          复核检查清单
        </h3>
        <ul class="text-xs space-y-2.5 leading-relaxed">
          ${[
            ['数字一致性','正文 / 表格 / 图表 / 摘要数字一致'],
            ['术语规范','使用方法学标准术语，避免口语化'],
            ['错别字 / 标点','无错别字、句号 / 分号一致'],
            ['段落结构','章节顺序 / 标题层级 / 表格编号'],
            ['法规引用','法规条款 / 国标编号引用准确'],
            ['评级口径','信用等级释义与方法学一致'],
            ['脱敏处理','敏感金额 / 案号 / 个人信息已脱敏'],
            ['版式规范','字体 / 字号 / 间距 / 表格样式'],
            ['附录完整','财务概要 / 计算公式 / 等级释义'],
            ['签字签章','项目组 / 一审 / 二审 / 三审签字齐全']
          ].map(([t,d]) => `
            <li class="flex items-start gap-2">
              <input type="checkbox" checked class="mt-0.5" />
              <div>
                <div class="font-medium text-xs">${t}</div>
                <div class="text-[10px] text-muted leading-snug">${d}</div>
              </div>
            </li>
          `).join('')}
        </ul>
        <div class="mt-4 pt-3 border-t border-border space-y-2">
          <button onclick="finalizeReview()" class="w-full text-xs py-2 bg-success text-white rounded hover:opacity-90">✓ 复核通过 · 提交评级总监签字</button>
          <button onclick="returnToTeam()" class="w-full text-xs py-2 border border-warning text-warning rounded hover:bg-warning hover:text-white">↻ 退回项目组修改</button>
        </div>
      </div>
    </section>

    <!-- 历史复核记录 -->
    <section class="bg-white rounded-lg shadow-card">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          历史复核记录
        </h3>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2.5">复核编号</th>
          <th class="py-2.5">报告 ID</th>
          <th class="py-2.5">受评对象</th>
          <th class="py-2.5">复核人</th>
          <th class="py-2.5">阶段</th>
          <th class="py-2.5">问题数</th>
          <th class="py-2.5">状态</th>
          <th class="py-2.5">分派 / 完成</th>
        </tr></thead>
        <tbody class="divide-y divide-border">
          ${tasks.map(t => `
            <tr class="hover:bg-bg">
              <td class="px-4 py-2.5 num text-[11px]">${t.id}</td>
              <td class="text-xs num text-brand-700">${t.report}</td>
              <td class="text-sm font-medium">${t.subject}</td>
              <td class="text-xs">${t.proofreader}</td>
              <td class="text-xs text-muted">${t.stage}</td>
              <td class="text-xs num">${t.issues}</td>
              <td><span class="text-xs px-1.5 py-0.5 rounded ${t.status==='已通过'?'bg-success/10 text-success border border-success/30':'bg-warning/10 text-warning border border-warning/30'}">${t.status}</span></td>
              <td class="text-xs num text-muted">${t.assignedAt}<br/>${t.completedAt || '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function resolveIssue(id) {
  toast('问题已标记为处理中 · 已通知项目组', 'info');
}
function finalizeReview() {
  confirmDialog({
    title:'复核通过 · 提交评级总监签字?',
    content:'<p class="text-sm">复核通过后将提交评级总监 U 盾签字 + 加盖公章；签字后报告进入"评级公布"阶段，不可撤回。</p>',
    okText:'通过', cancelText:'取消'
  }).then(ok => { if (ok) { toast('复核完成 · 已签字留痕，提交评级总监','success'); setTimeout(()=>location.href='disclosure-channels.html', 800); } });
}
function returnToTeam() {
  toast('已退回项目组 · 项目组将根据问题清单修改后重新提交', 'warning');
}
function askAIProofread() {
  const tasks = MockData.proofreadingTasks;
  const issues = MockData.proofreadingIssues;
  const ctx = '【复核任务】' + tasks.length + ' 项 · 已通过 ' + tasks.filter(t=>t.status==='已通过').length + ' · 修改中 ' + tasks.filter(t=>t.status==='修改中').length + '\n【待修改问题】' + issues.length + ' 个';
  AIAgent.setScene('kb-rag');
  AIAgent.send('请基于以上复核任务：① 修改中报告的问题严重度分类 ② 数字一致性 / 术语规范 / 错别字 / 段落结构 4 类常见问题清单 ③ 给项目组的修改优先级建议 ④ 复核签字前的 10 项检查清单 ⑤ 引用《程序指引》第三十四条。', ctx);
}

mountLayout('review-proofreading', renderMain);
</script>
</body>
</html>
