<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>

<div id="app"></div>

<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
/* ===== 当前步骤状态 —— 严格对齐《产品设计文档 V1.0》5.5 节五步闭环工作流 ===== */
const STEPS = [
  { n: 1, label: '目标录入与全域抓取', desc: '主体识别 + 隐私计算合规抓取' },
  { n: 2, label: '白盒化解构',          desc: '基于 GB/T 23794-2023 逆向归因' },
  { n: 3, label: '跨域翻译 + 图谱穿透', desc: 'PD/LGD 映射 + 关联传染性预警' },
  { n: 4, label: '熔断校验',            desc: '刚性底线核查 / D级一票否决' },
  { n: 5, label: '双轨融合报告',        desc: '人工复判 + 一键生成 + 审计归档' }
];
let currentStep = 1;
let selectedSubject = null;

// 从 URL ? step= 与 ?projectId= / ?subject= 初始化（含模糊匹配兜底）
(function initFromUrl(){
  const p = new URLSearchParams(location.search);
  const s = parseInt(p.get('step'));
  if (s >= 1 && s <= 5) currentStep = s;

  // 优先从 ?projectId= 派生主体（项目驱动场景）
  const pid = p.get('projectId');
  if (pid) {
    const proj = (MockData.projects || []).find(x => x.id === pid);
    if (proj) {
      const m = MockData.subjects.find(x => x.name === proj.subject);
      if (m) selectedSubject = m;
    }
  }

  const subj = p.get('subject');
  if (!selectedSubject && subj) {
    // 1) 严格相等
    let m = MockData.subjects.find(x => x.name === subj);
    // 2) 主体全称包含 URL 主体名（短 → 全）
    if (!m) m = MockData.subjects.find(x => x.name.includes(subj));
    // 3) URL 主体名包含主体全称（罕见）
    if (!m) m = MockData.subjects.find(x => subj.includes(x.name));
    // 4) 去掉常见后缀再匹配（"江苏华西集团" vs "江苏华西集团有限公司"）
    if (!m) {
      const trim = (x) => x.replace(/(有限公司|股份有限公司|有限责任公司|集团|股份|公司)$/g,'').replace(/\s+/g,'');
      const sn = trim(subj);
      m = MockData.subjects.find(x => trim(x.name).includes(sn) || sn.includes(trim(x.name)));
    }
    selectedSubject = m || MockData.subjects[0];
    if (!m) {
      console.warn('[CCASCEA] URL subject not matched in subjects[]:', subj, '→ fallback to', MockData.subjects[0].name);
    }
  }
})();

function renderMain() {
  return `
    <!-- 数据来源 / 演示性质声明 -->
        <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
          <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span><strong class="text-ink">数据声明：</strong>本页面"主体名称、统一社会信用代码、注册地址、法定代表人、注册资本、上市状态、行业类别"等<strong>事实型字段</strong> 100% 来自公开资料（国家企业信用信息公示系统 / 上市公司年报 / 信用中国 / 企业官网 / 远东资信公开评级报告）；"信用等级、KPI、流水编号、调用次数、订阅时间、扣分事件、PD / LGD 调整、合规命中"等<strong>运营字段</strong>为 CCASCEA 智能体演示数据，仅供产品功能展示。</span>
        </div>

    <!-- 顶部步骤指示器 -->
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-lg font-semibold flex items-center gap-2">
          <span class="w-1 h-5 bg-brand-600 rounded"></span>
          双轨融合引擎 · 五步算法（评级建模阶段工具）
        </h1>
        <div class="flex items-center gap-2">
          <button onclick="askAIForCurrentStep()" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded-md flex items-center gap-1 hover:opacity-90" title="调用 qwen3.6-max-preview，按 6 步可视化思考链辅助当前步骤">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M9.75 9.75h.01M14.25 9.75h.01M9 16h6m-3-12a9 9 0 100 18 9 9 0 000-18z"/></svg>
            AI 智能助手 · 当前步骤
          </button>
          <button onclick="saveDraft()" class="text-xs px-3 py-1.5 border border-border rounded-md hover:bg-bg">保存草稿</button>
          <button onclick="exitFlow()" class="text-xs px-3 py-1.5 border border-border rounded-md hover:bg-bg">退出</button>
        </div>
      </div>
      ${renderStepIndicator()}
    </section>

    <!-- 主区域：根据 currentStep 切换 -->
    <section id="step-content" class="space-y-5">
      ${renderStepContent()}
    </section>

    <!-- 底部操作 -->
    <section class="mt-5 flex items-center justify-between bg-white rounded-lg shadow-card p-4">
      <div class="text-xs text-muted">
        当前步骤：<span class="font-medium text-brand-600">第 ${currentStep} 步 · ${STEPS[currentStep-1].label}</span>
        <span class="mx-2">·</span>
        进度 <span class="num">${Math.round(currentStep / 5 * 100)}%</span>
      </div>
      <div class="flex items-center gap-2">
        ${currentStep > 1 ? '<button onclick="prevStep()" class="text-xs px-4 py-1.5 border border-border rounded-md hover:bg-bg">← 上一步</button>' : ''}
        ${currentStep < 5 ? '<button onclick="nextStep()" class="text-xs px-4 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700">下一步 →</button>' : '<button onclick="finishFlow()" class="text-xs px-4 py-1.5 bg-success text-white rounded-md hover:bg-green-700">✓ 完成并生成报告</button>'}
      </div>
    </section>
  `;
}

function renderStepIndicator() {
  return `
    <div class="step-indicator">
      ${STEPS.map(s => {
        const active = s.n === currentStep;
        const done = s.n < currentStep;
        const cls = done ? 'bg-success text-white border-success'
                  : active ? 'bg-brand-600 text-white border-brand-600 ring-4 ring-brand-100'
                  : 'bg-white text-muted border-border';
        const labelCls = (done || active) ? 'text-ink font-medium' : 'text-muted';
        return `
          <div class="step flex flex-col items-center text-center" style="flex:1">
            <div class="w-10 h-10 rounded-full border-2 flex items-center justify-center font-semibold ${cls}">
              ${done ? '✓' : s.n}
            </div>
            <div class="mt-2 text-xs ${labelCls}">${s.label}</div>
            <div class="text-[10px] text-muted mt-0.5">${s.desc}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderStepContent() {
  switch(currentStep) {
    case 1: return renderStep1();
    case 2: return renderStep2();
    case 3: return renderStep3();
    case 4: return renderStep4();
    case 5: return renderStep5();
  }
}

/* ============== Step 1：目标录入与机制化全域抓取（无感启动） ============== */
/* 文档 5.5 节：分析师录入主体即触发隐私计算+合规API秒级抓取全量公共信用 */
function renderStep1() {
  const opts = MockData.subjects.map(s => `<option value="${s.uscc}" ${selectedSubject && selectedSubject.uscc === s.uscc ? 'selected' : ''}>${s.name} · ${s.uscc}</option>`).join('');
  const sel = selectedSubject || {};
  // 仅在已选择主体时展示采集进度（无感启动）
  const collectionDone = !!sel.uscc;
  return `
    <div class="bg-white rounded-lg shadow-card p-6">
      <h2 class="text-base font-semibold mb-2">第一步 · 目标录入与机制化全域抓取（无感启动）</h2>
      <p class="text-sm text-muted mb-5">输入被评主体的名称或统一社会信用代码，智能体将<span class="text-brand-600 font-medium">自动通过隐私计算"安全融合舱"</span>秒级调取全量公共信用信息（无需被评企业任何线上交互）。</p>

      <div class="grid grid-cols-2 gap-5">
        <div>
          <label class="text-xs text-muted">被评主体（名称或统一社会信用代码）<span class="text-danger">*</span></label>
          <select id="subject-select" onchange="onSubjectChange(this.value)"
            class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option value="">请选择或搜索主体...</option>
            ${opts}
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">评级类型<span class="text-danger">*</span></label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option>主体首次评级</option>
            <option selected>主体跟踪评级</option>
            <option>主体复评</option>
            <option>债项评级</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">评级周期</label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option>年度</option>
            <option selected>跟踪评级</option>
            <option>不定期</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">数据快照时点</label>
          <input type="datetime-local" value="2026-04-28T14:32"
            class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm" />
        </div>
        <div class="col-span-2">
          <label class="text-xs text-muted">任务备注</label>
          <textarea rows="2" class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm" placeholder="选填，记录评级背景、客户要求等..."></textarea>
        </div>
      </div>

      ${sel.uscc ? `
      <div class="mt-5 p-4 border border-brand-100 bg-brand-50 rounded-md">
        <div class="text-xs text-brand-700 font-semibold mb-2 flex items-center gap-2">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M5 13l4 4L19 7"/></svg>
          已识别主体 · 基础信息
        </div>
        <div class="grid grid-cols-4 gap-3 text-xs">
          <div><div class="text-muted">主体名称</div><div class="font-medium mt-1">${sel.name}</div></div>
          <div><div class="text-muted">统一社会信用代码</div><div class="num font-medium mt-1">${sel.uscc}</div></div>
          <div><div class="text-muted">行业</div><div class="font-medium mt-1">${sel.industry}</div></div>
          <div><div class="text-muted">法定代表人</div><div class="font-medium mt-1">${sel.legalRep || '—'}</div></div>
        </div>
      </div>
      ` : '<div class="mt-5 p-4 border border-dashed border-border rounded-md text-center text-xs text-muted">请先选择主体以触发"无感启动"全域抓取</div>'}

      <!-- 全域抓取实时进度（信用中国为单一权威聚合源） -->
      <div class="mt-5 p-4 border border-border rounded-md bg-bg">
        <div class="flex items-center justify-between mb-3">
          <div class="text-xs font-semibold flex items-center gap-2">
            <span class="w-1 h-3 bg-brand-600 rounded"></span>
            全域机制化采集 · 信用中国（单一权威聚合源）${collectionDone ? '<span class="text-success">[采集已完成]</span>' : '<span class="text-muted">[等待主体选择]</span>'}
          </div>
          <span class="text-[10px] text-muted">隐私计算"安全融合舱"：FL · MPC · TEE · DP</span>
        </div>

        ${(function() {
          const ds = MockData.dataSources[0];
          if (!ds) return '';
          return `
          <!-- 信源主卡：权威聚合源 + 法规依据 -->
          <div class="bg-white border border-brand-300 rounded-md p-4 mb-3">
            <div class="flex items-start justify-between flex-wrap gap-2">
              <div>
                <div class="text-sm font-semibold text-brand-700 flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9-4.97 0-9-4.03-9-9 0-4.97 4.03-9 9-9 4.97 0 9 4.03 9 9z"/></svg>
                  ${ds.name}
                </div>
                <div class="text-[11px] text-muted mt-1">出具单位：<span class="text-ink">${ds.issuer}</span> · 网址：<a href="${ds.url}" target="_blank" class="text-brand-600 hover:underline">${ds.url}</a></div>
              </div>
              <div class="flex flex-col items-end gap-1">
                <span class="text-xs px-2 py-0.5 rounded ${collectionDone ? 'bg-success/10 text-success border border-success/30' : 'bg-bg text-muted border border-border'}">${collectionDone ? '✓ 采集完成' : '… 待采'}</span>
                ${collectionDone ? `<span class="text-[10px] num text-muted">${ds.fields} 字段 · ${ds.ms} ms</span>` : ''}
              </div>
            </div>
            <div class="mt-3 pt-3 border-t border-border text-[11px] text-muted leading-relaxed grid grid-cols-1 md:grid-cols-3 gap-2">
              <div><span class="text-ink/70">报告标准：</span>${ds.reportStandard}</div>
              <div><span class="text-ink/70">评价标准：</span>${ds.evaluationStandard}</div>
              <div><span class="text-ink/70">基础目录：</span>${ds.catalog}</div>
            </div>
          </div>

          <!-- 8 维度子集覆盖（信用中国已聚合的子源映射）-->
          <div class="text-[11px] text-muted mb-2 flex items-center gap-1">
            <span class="w-1 h-2 bg-brand-600 rounded"></span>
            <strong class="text-ink/80">GB/T 45255-2025 八大维度覆盖</strong>
            <span class="text-muted">— 信用中国已聚合下列子源，无需点对点对接</span>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            ${ds.coverage.map(c => `
              <div class="border border-border bg-white rounded p-2 text-xs">
                <div class="flex items-center justify-between">
                  <span class="font-medium text-ink/80">${c.dim}</span>
                  ${collectionDone ? `<span class="text-[10px] num text-success">${c.fields}字段</span>` : `<span class="text-[10px] text-muted">…</span>`}
                </div>
                <div class="text-[10px] text-muted mt-1 leading-snug">${c.source}</div>
              </div>
            `).join('')}
          </div>
          `;
        })()}

        ${collectionDone ? `
        <div class="mt-3 pt-3 border-t border-border flex items-center justify-between text-xs flex-wrap gap-2">
          <div class="text-success font-medium flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M5 13l4 4L19 7"/></svg>
            采集完成 · 共获取 <span class="num">${MockData.dataSources[0] ? MockData.dataSources[0].fields : 0}</span> 个字段 · 0 次原始政务数据出域
          </div>
          <span class="text-[10px] text-muted">血缘追踪 + 审计日志已生成 · 点击"下一步"进入白盒化解构</span>
        </div>
        ` : ''}
      </div>
    </div>
  `;
}

/* ============== Step 2：信用中国官方公共信用信息报告（事实型披露 · 1:1 复刻） ============== */
/* 严格按真实 PDF 报告：报告头 + 信用信息概要（8 类计数）+ 八大章节明细 + 信用状况提升建议
 * 信用中国是事实型信息披露平台，无评分、无等级、无雷达；评分逻辑在 Step 3（远东内部跨域翻译）展开
 * ----------------------------------------------------------------------------- */
function renderStep2() {
  const sel = selectedSubject || MockData.subjects[0];
  const r = sel.officialReport || {};
  const labels = (r.labels || []).map(l => {
    const map = {
      '守信激励对象':     'bg-success/10 text-success border-success/40',
      '严重失信主体':     'bg-danger/10 text-danger border-danger/40',
      '失信惩戒对象':     'bg-danger/10 text-danger border-danger/40',
      '失信被执行人':     'bg-danger/10 text-danger border-danger/40',
      '经营异常':         'bg-warning/10 text-warning border-warning/40',
      '重点关注':         'bg-warning/10 text-warning border-warning/40',
      '重点项目':         'bg-brand-100 text-brand-700 border-brand-200',
      '海关高级认证企业': 'bg-brand-100 text-brand-700 border-brand-200',
      '存续':             'bg-success/10 text-success border-success/40'
    };
    return `<span class="text-[11px] px-2 py-0.5 rounded-full border ${map[l] || 'bg-bg text-muted border-border'}">${l}</span>`;
  }).join(' ');

  // 信用信息概要（8 类条目计数 dashboard）
  const summary = r.summary || {};
  const summaryItems = [
    { key:'行政管理', cls:'border-brand-200 bg-brand-50/30 text-brand-700' },
    { key:'诚实守信', cls:'border-success/30 bg-success/5 text-success' },
    { key:'严重失信', cls:'border-danger/30 bg-danger/5 text-danger' },
    { key:'经营异常', cls:'border-warning/30 bg-warning/5 text-warning' },
    { key:'信用承诺', cls:'border-brand-200 bg-brand-50/30 text-brand-700' },
    { key:'信用评价', cls:'border-border bg-bg text-muted' },
    { key:'司法判决', cls:'border-danger/30 bg-danger/5 text-danger' },
    { key:'其他',     cls:'border-border bg-bg text-muted' }
  ];

  // 段落辅助渲染
  function renderSection(num, title, count, html) {
    const empty = !count;
    return `
      <details class="border border-border rounded-md mb-3 ${empty ? 'bg-bg/30' : 'bg-white'}" ${count > 0 ? 'open' : ''}>
        <summary class="px-4 py-3 cursor-pointer flex items-center justify-between hover:bg-bg/50">
          <div class="flex items-center gap-2 text-sm font-semibold">
            <span class="text-brand-600">${num}、</span>
            <span>${title}</span>
            <span class="text-xs text-muted font-normal">（共 <span class="num font-medium">${count || 0}</span> 条）</span>
          </div>
          ${empty ? '<span class="text-xs text-muted">查询期内无相关记录</span>' : '<svg class="w-4 h-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M19 9l-7 7-7-7"/></svg>'}
        </summary>
        ${count > 0 ? `<div class="border-t border-border">${html}</div>` : ''}
      </details>
    `;
  }

  const baseInfoRows = Object.entries(r.basicInfo || {}).map(([k,v]) =>
    `<tr><td class="px-4 py-2 text-xs text-muted bg-bg/30 w-1/3">${k}：</td><td class="px-4 py-2 text-sm">${v || '—'}</td></tr>`
  ).join('');

  // 行政管理列表
  const adminRows = (r.administrativeMgmt || []).map((a, i) => `
    <div class="border-b border-border px-4 py-3 hover:bg-bg/40">
      <div class="flex items-center gap-3 mb-2">
        <span class="text-xs px-2 py-0.5 rounded bg-brand-100 text-brand-700 border border-brand-200">${a.type}</span>
        <span class="text-xs text-muted">第 ${i+1} 条</span>
      </div>
      <table class="w-full text-xs">
        <tbody class="divide-y divide-border/40">
          <tr><td class="py-1 text-muted w-32">行政许可决定文书号：</td><td class="num">${a.docNo}</td></tr>
          <tr><td class="py-1 text-muted">行政许可决定文书名称：</td><td>${a.name}</td></tr>
          <tr><td class="py-1 text-muted">许可类别：</td><td>${a.category}</td></tr>
          <tr><td class="py-1 text-muted">许可决定日期：</td><td class="num">${a.date}</td></tr>
          <tr><td class="py-1 text-muted">有效期：</td><td class="num">${a.validFrom} 至 ${a.validTo}</td></tr>
          <tr><td class="py-1 text-muted">许可内容：</td><td>${a.content}</td></tr>

          <tr><td class="py-1 text-muted">数据来源单位：</td><td>${a.source}</td></tr>

            source: l.source, target: l.target,
            lineStyle: l.danger ? { color:'#DC2626', width:2 } : (l.warning ? { color:'#F59E0B', type:'dashed' } : {}),
            label: { show: !!l.label, formatter: l.label, fontSize: 9, color: l.danger ? '#DC2626' : (l.warning ? '#F59E0B' : '#64748B') }
          }))
        }]
      });
      window.addEventListener('resize', () => g.resize());
    }
  }
}

mountLayout('subject-rating', renderMain);
initCharts();
</script>
</body>
</html>
