<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多渠道披露 + 电子公章 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
/* ============== P0-2 多渠道披露 + 电子公章
 * 评级出报告 → 评级总监签字 + 加盖电子公章 → 一键多渠道披露
 * 依据：《信用评级业务程序指引》第三十九至四十一条 ============== */
function renderMain() {
  const dc = MockData.disclosureChannels;
  const list = MockData.disclosureChannelsList;
  const seals = MockData.eSeals;
  return `
    <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
      <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span><strong class="text-ink">数据声明：</strong>披露渠道清单（公司官网 / 上交所 / 银行间 / 央行 / 证监会等）为真实监管框架；具体披露记录与电子公章使用次数为 CCASCEA 演示数据。</span>
    </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            多渠道披露 + 电子公章管理
            <span class="text-xs text-muted font-normal ml-2">P0 · 《程序指引》第三十九至四十一条</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            评级业务公布与归档专用工作台。按债券品种自动匹配披露渠道，
            <strong>评级总监 U 盾签字 + 加盖电子公章 → 一键发起多渠道披露</strong>，
            披露完成自动留痕（精确到分钟）。
          </p>
        </div>
        <button onclick="newDisclose()" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700">+ 发起新披露</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">披露渠道</div><div class="num text-2xl font-bold text-brand-600 mt-1">${list.length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">本月已披露</div><div class="num text-2xl font-bold text-success mt-1">${dc.length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">部分披露</div><div class="num text-2xl font-bold text-warning mt-1">${dc.filter(d=>d.status.includes('部分')).length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">电子公章</div><div class="num text-2xl font-bold text-brand-700 mt-1">${seals.length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">本月用印</div><div class="num text-2xl font-bold text-brand-600 mt-1">${seals.reduce((s,x)=>s+x.usedTimes,0)}</div></div>
      </div>
    </section>

    <!-- 9 个披露渠道 -->
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          9 大披露渠道（按债券品种 + 监管要求自动匹配）
        </h3>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 p-5">
        ${list.map(c => `
          <div class="border ${c.mandatory?'border-danger/30 bg-danger/5':'border-border'} rounded p-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-sm font-medium">${c.name}</div>
                <div class="text-[10px] text-muted leading-snug mt-1">${c.desc}</div>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded ${c.mandatory?'bg-danger/10 text-danger':'bg-bg text-muted'}">${c.mandatory?'强制':'按需'}</span>
            </div>
            <div class="text-[10px] text-muted mt-2 num">${c.code}</div>
          </div>
        `).join('')}
      </div>
    </section>

    <!-- 电子公章管理 -->
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border flex items-center justify-between">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          电子公章 / 签名管理
        </h3>
        <span class="text-xs text-muted">U 盾 / 证书签名 · 本月用印 ${seals.reduce((s,x)=>s+x.usedTimes,0)} 次</span>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">编号</th>
          <th class="py-2">名称</th>
          <th class="py-2">类型</th>
          <th class="py-2">用印场景</th>
          <th class="py-2">委托人</th>
          <th class="py-2 text-right">本月用印</th>
          <th class="py-2">状态</th>
          <th class="py-2 pr-4 text-right">操作</th>
        </tr></thead>
        <tbody class="divide-y divide-border">
          ${seals.map(s => `
            <tr class="hover:bg-bg">
              <td class="px-4 py-2.5 num text-[11px]">${s.id}</td>
              <td class="text-sm font-medium">${s.name}</td>
              <td class="text-xs"><span class="px-1.5 py-0.5 rounded ${s.type==='公章'?'bg-danger/10 text-danger':s.type==='合同章'?'bg-warning/10 text-warning':'bg-brand-100 text-brand-700'}">${s.type}</span></td>
              <td class="text-xs text-muted">${s.usage}</td>
              <td class="text-xs">${s.delegate}</td>
              <td class="text-xs num text-right">${s.usedTimes}</td>
              <td class="text-xs"><span class="text-success">${s.status}</span></td>
              <td class="text-right pr-4"><button onclick="useSeal('${s.id}')" class="text-xs text-brand-600 hover:underline">用印 →</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>

    <!-- 披露记录 -->
    <section class="bg-white rounded-lg shadow-card">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          披露记录
        </h3>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">编号</th>
          <th class="py-2">报告 ID</th>
          <th class="py-2">受评对象</th>
          <th class="py-2">披露渠道</th>
          <th class="py-2">披露时点</th>
          <th class="py-2">状态</th>
          <th class="py-2 text-center">公章</th>
          <th class="py-2 pr-4 text-right">操作</th>
        </tr></thead>
        <tbody class="divide-y divide-border">
          ${dc.map(d => `
            <tr class="hover:bg-bg">
              <td class="px-4 py-2.5 num text-[11px]">${d.id}</td>
              <td class="text-xs num text-brand-700">${d.report}</td>
              <td class="text-sm font-medium">${d.subject}</td>
              <td class="text-xs text-muted">${d.channels.join(' · ')}</td>
              <td class="text-xs num text-muted">${d.publishAt}</td>
              <td><span class="text-xs px-1.5 py-0.5 rounded ${d.status==='已发布'?'bg-success/10 text-success border border-success/30':'bg-warning/10 text-warning border border-warning/30'}">${d.status}</span></td>
              <td class="text-center text-xs ${d.sealed?'text-success':'text-warning'}">${d.sealed?'✓ 已用印':'未用印'}</td>
              <td class="text-right pr-4"><button onclick="viewDC('${d.id}')" class="text-xs text-brand-600 hover:underline">详情 →</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function newDisclose() {
  openModal({
    title: '发起多渠道披露',
    width: 'max-w-2xl',
    content: `
      <div class="space-y-3 text-sm">
        <div><label class="text-xs text-muted">关联评级报告 <span class="text-danger">*</span></label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md text-sm">
            ${MockData.reports.slice(0,6).map(r => `<option value="${r.id}">${r.id} · ${r.subject}</option>`).join('')}
          </select>
        </div>
        <div><label class="text-xs text-muted">披露渠道（按债券品种自动建议） <span class="text-danger">*</span></label>
          <div class="mt-1 grid grid-cols-3 gap-2 text-xs">
            ${MockData.disclosureChannelsList.map(c => `
              <label class="border border-border rounded p-2 flex items-center gap-1.5 ${c.mandatory?'bg-danger/5':''}">
                <input type="checkbox" ${c.mandatory?'checked disabled':''} />
                <span>${c.name}</span>
              </label>
            `).join('')}
          </div>
          <div class="text-[10px] text-muted mt-2">强制渠道（公司官网 / 央行 / 证监会）已默认选中且不可取消</div>
        </div>
        <div class="border border-warning/30 bg-warning/5 rounded p-3 text-xs leading-relaxed">
          <strong class="text-warning">⚠ 用印前须完成：</strong>
          ① 评级总监 U 盾签字（评级报告）
          ② 加盖远东资信公章（电子）
          ③ 系统自动生成披露公告（按渠道模板）
        </div>
      </div>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded">取消</button>
      <button onclick="closeModal();sealAndPublish()" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded hover:bg-brand-700">签字 + 用印 + 发起披露</button>
    `
  });
}
function sealAndPublish() {
  toast('正在调用评级总监 U 盾签字...', 'info', 1200);
  setTimeout(() => toast('已加盖远东资信公章 + 评级总监签名', 'success'), 1300);
  setTimeout(() => toast('多渠道披露已发起 · 各渠道发布完成时间将逐个回写', 'success', 3000), 2500);
}
function useSeal(id) {
  const s = MockData.eSeals.find(x => x.id === id);
  if (!s) return;
  openModal({
    title: '用印授权确认 · ' + s.name,
    content: `
      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div><span class="text-muted">类型：</span>${s.type}</div>
          <div><span class="text-muted">委托人：</span>${s.delegate}</div>
          <div class="col-span-2"><span class="text-muted">用印场景：</span>${s.usage}</div>
        </div>
        <div class="border border-warning/30 bg-warning/5 rounded p-3 text-xs">
          <strong>用印需 U 盾签名授权。</strong>每次用印记录将写入审计链，包含：用印人、用印时间（精确到秒）、关联文档、IP / 设备指纹。
        </div>
      </div>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded">取消</button>
      <button onclick="closeModal();toast('U 盾签名验证通过 · 用印完成，已留痕审计链','success')" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded">U 盾签名授权</button>
    `
  });
}
function viewDC(id) {
  const d = MockData.disclosureChannels.find(x => x.id === id);
  if (!d) return;
  openModal({
    title: '披露详情 · ' + d.id,
    content: `
      <div class="space-y-3 text-sm">
        <div><span class="text-muted text-xs">关联报告：</span><span class="num">${d.report}</span></div>
        <div><span class="text-muted text-xs">受评对象：</span>${d.subject}</div>
        <div><span class="text-muted text-xs">披露渠道：</span>${d.channels.join(' · ')}</div>
        <div><span class="text-muted text-xs">披露时点：</span><span class="num">${d.publishAt}</span></div>
        <div><span class="text-muted text-xs">状态：</span>${d.status}</div>
        <div><span class="text-muted text-xs">公章：</span>${d.sealed ? '已加盖远东资信公章 + 评级总监签名' : '未用印'}</div>
        <div class="border-t border-border pt-3 text-[11px] text-muted leading-relaxed">
          披露完成时点已写入审计链；评级有效期内不可撤回；如需更正须重新发起披露。
        </div>
      </div>
    `,
    footer: '<button onclick="closeModal()" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded">关闭</button>'
  });
}

mountLayout('disclosure-channels', renderMain);
</script>
</body>
</html>
