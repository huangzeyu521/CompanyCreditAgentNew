<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>复评流程 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260511a"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260511a" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260511a"></script>
<script src="../assets/js/mock-data.js?v=20260511a"></script>
<script src="../assets/js/copy-corpus.js?v=20260511a"></script>
<script src="../assets/js/common.js?v=20260511a"></script>
<script src="../assets/js/layout.js?v=20260511a"></script>
<script src="../assets/js/prompts.js?v=20260511a"></script>
<script src="../assets/js/ai-agent.js?v=20260511a"></script>
<script>
/* ============== 复评流程（FR-D-007）==============
 *  · 项目模式：本项目复评 detail view（受评主体 + 复评元数据 + 7 步流程 + 异议理由 + 证据 + 信评委安排 + 结论 + 行动区）
 *  · 全局模式：全公司复评台账 list view
 * ====================================================== */
function renderMain() {
  const p = (typeof getCurrentProject === 'function') ? getCurrentProject() : null;
  const allAp = MockData.appeals || [];
  if (p) return renderDetailView(p, allAp);
  return renderListView(allAp);
}

const STEPS = [
  { n:1, t:'收到异议', d:'委托方/受评对象 5 个工作日内提交' },
  { n:2, t:'初审受理', d:'合规部审核异议是否合规' },
  { n:3, t:'调取证据', d:'调取原评级底稿 + 新增证据' },
  { n:4, t:'排定信评委', d:'5 个工作日内召开' },
  { n:5, t:'信评委审议', d:'≥ 5 委员，2/3 同意有效' },
  { n:6, t:'出具结论', d:'维持 / 调整' },
  { n:7, t:'披露与归档', d:'按监管要求披露' }
];

function renderDetailView(p, allAp) {
  const projectAp = allAp.filter(a => a.project === p.id || a.subject === p.subject);
  const cur = projectAp[0] || null;
  const subj = (MockData.subjects || []).find(s => s.name === p.subject) || {};
  const labels = subj.creditLabels || [];
  const leadMember = (p.team && p.team[0]) || {};
  const leadName = typeof leadMember === 'object' ? leadMember.name : leadMember;

  const noticeBanner = `
    <div class="bg-success/5 border-l-4 border-success rounded-md px-4 py-3 mb-4 text-xs leading-relaxed">
      <div class="flex items-start gap-2">
        <span class="text-success font-bold">💰 合规明示</span>
        <div class="flex-1 text-ink/85">
          <strong>GB/T 45255-2025 第十一条：</strong>第三方机构<strong class="text-success">不得以更正或更新信息为由，向企业额外收取费用</strong>。
          复评 / 补料 / 信用修复联动重新评级一律 <strong class="text-success">免费</strong>。
        </div>
      </div>
    </div>`;

  const header = `
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between flex-wrap gap-2">
        <div class="min-w-0">
          <h1 class="text-lg font-semibold flex items-center gap-2 flex-wrap">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            <span class="text-brand-700">${p.subject}</span>
            <span class="text-muted">·</span>
            复评流程
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">项目级 · detail view</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            本页展示本项目（<strong class="text-ink">${p.id}</strong>）的复评申请详情：异议理由、新增证据、7 步流程进度、信评委安排、结论与披露。
            <strong>复评仅限一次</strong>（《信评委制度》第二十二条），<strong>5 个工作日内召开信评委</strong>（《程序指引》第三十六条）。
          </p>
          <div class="text-[11px] mt-2 flex items-center gap-3">
            <a href="project-workbench.html?projectId=${p.id}" class="text-brand-600 hover:underline">← 返回项目工作台</a>
            <span class="text-muted">|</span>
            <a href="appeal-flow.html" class="text-brand-600 hover:underline">查看全公司复评台账 →</a>
          </div>
        </div>
        <button onclick="newAppeal()" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700 flex-shrink-0">+ 为本项目新建复评申请</button>
      </div>
    </section>`;

  const subjectCard = `
    <section class="bg-white rounded-lg shadow-card mb-5 overflow-hidden">
      <div class="bg-gradient-to-r from-brand-600 to-brand-700 text-white px-5 py-4">
        <div class="text-xs text-white/70 mb-1">受评主体</div>
        <div class="text-lg font-bold flex items-center gap-2 flex-wrap">
          <span>${p.subject}</span>
          ${labels.map(l => `<span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full border border-white/30">${l}</span>`).join('')}
        </div>
        <div class="text-[11px] text-white/85 mt-2 flex flex-wrap gap-x-4 gap-y-1">
          <span>USCC · <span class="num">${subj.uscc || '—'}</span></span>
          <span>行业 · ${p.industry || '—'}</span>
          <span>评级类型 · ${p.ratingType || (Array.isArray(p.ratingTypes) ? p.ratingTypes.join('+') : '—')}</span>
          <span>项目组组长 · ${leadName || '—'}</span>
          <span>立项 · ${p.createdAt || '—'}</span>
        </div>
      </div>
    </section>`;

  if (!cur) {
    return `
      ${noticeBanner}
      ${header}
      ${subjectCard}
      <section class="bg-white rounded-lg shadow-card px-5 py-16 text-center">
        <div class="text-4xl mb-3">🔄</div>
        <div class="text-sm font-medium">本项目尚无复评申请</div>
        <div class="text-xs text-muted mt-2">委托方对评级结果有异议的，可发起复评（限一次）</div>
        <button onclick="newAppeal()" class="mt-4 text-xs px-4 py-2 bg-brand-600 text-white rounded-md hover:bg-brand-700">为本项目新建复评申请</button>
      </section>
    `;
  }

  // 复评元数据 + 总体结论
  const isConcluded = cur.status === 'concluded';
  const adjusted = isConcluded && cur.conclusion && cur.conclusion.includes('调整');
  const verdictCls = !isConcluded ? 'bg-brand-50 border-brand-300'
                  : adjusted ? 'bg-warning/5 border-warning/40'
                  : 'bg-success/5 border-success/40';
  const verdictIcon = !isConcluded ? '⏳' : adjusted ? '↕' : '✓';
  const verdictText = !isConcluded ? `复评进行中 · 第 ${cur.currentStep}/7 步`
                    : adjusted ? `已结复评 · 等级调整（${cur.originalGrade} → ${cur.finalGrade}）`
                    : `已结复评 · 维持原等级（${cur.finalGrade}）`;
  const verdictTone = !isConcluded ? 'text-brand-700' : adjusted ? 'text-warning' : 'text-success';

  const metaCard = `
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border flex items-center justify-between flex-wrap gap-2">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          本次复评 · ${cur.id}
        </h2>
        <span class="text-[11px] num text-muted">提交：${cur.filedTime || cur.filedAt} · 渠道 ${cur.channel || '客户专用门户'}</span>
      </div>
      <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2 border-2 ${verdictCls} rounded-lg p-4 flex items-center gap-4">
          <div class="text-4xl ${verdictTone} font-bold">${verdictIcon}</div>
          <div class="flex-1">
            <div class="text-base font-semibold ${verdictTone}">${verdictText}</div>
            <div class="text-xs text-muted mt-1 leading-snug">${cur.reason}</div>
            <div class="mt-2 flex items-center gap-2 flex-wrap">
              <span class="text-[10px] px-2 py-0.5 rounded bg-bg border border-border">原等级：${cur.originalGrade}</span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-bg border border-border">申请等级：${cur.appealedGrade}</span>
              ${cur.finalGrade ? `<span class="text-[10px] px-2 py-0.5 rounded ${adjusted ? 'bg-warning/10 text-warning border border-warning/30' : 'bg-success/10 text-success border border-success/30'}">最终：${cur.finalGrade}</span>` : ''}
              ${cur.free ? '<span class="text-[10px] px-2 py-0.5 rounded bg-success/10 text-success border border-success/30">💰 免费</span>' : ''}
            </div>
          </div>
        </div>
        <div class="space-y-2 text-xs">
          <div class="flex items-center justify-between border-b border-border/60 pb-1.5">
            <span class="text-muted">委托方联系人</span><span class="font-medium">${cur.contact || '—'}</span>
          </div>
          <div class="flex items-center justify-between border-b border-border/60 pb-1.5">
            <span class="text-muted">提交时间</span><span class="num">${cur.filedTime || cur.filedAt}</span>
          </div>
          <div class="flex items-center justify-between border-b border-border/60 pb-1.5">
            <span class="text-muted">信评委安排</span><span class="num">${cur.committeeAt || '待排定'}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-muted">本项目复评次数</span><span class="num font-medium">${projectAp.length}</span>
          </div>
        </div>
      </div>
    </section>`;

  // 7 步流程进度
  const flowCard = `
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          7 步流程进度（当前 ${cur.currentStep}/7）
        </h2>
      </div>
      <div class="p-5">
        <div class="grid grid-cols-7 gap-2 items-stretch text-center">
          ${STEPS.map((s, i) => {
            const isDone = s.n < cur.currentStep;
            const isActive = s.n === cur.currentStep;
            const tone = isDone ? 'border-success bg-success/5'
                       : isActive ? 'border-brand-500 bg-brand-50 ring-2 ring-brand-100'
                       : 'border-border';
            const numCls = isDone ? 'bg-success text-white' : isActive ? 'bg-brand-600 text-white' : 'bg-bg text-muted';
            return `
              <div class="flex items-center gap-1">
                <div class="border-2 ${tone} rounded-lg p-2 flex-1 transition">
                  <div class="w-7 h-7 rounded-full ${numCls} flex items-center justify-center text-xs font-bold mx-auto">${isDone ? '✓' : s.n}</div>
                  <div class="text-[11px] font-medium mt-1.5">${s.t}</div>
                  <div class="text-[9px] text-muted leading-snug mt-0.5">${s.d}</div>
                </div>
                ${i < STEPS.length - 1 ? `<span class="text-muted text-xs">→</span>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        ${cur.responsibility ? `<div class="mt-4 text-[11px] text-muted">责任分工：${cur.responsibility}</div>` : ''}
      </div>
    </section>`;

  // 异议理由
  const reasonCard = `
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-warning rounded"></span>
          异议理由
        </h2>
      </div>
      <div class="p-5 text-sm leading-relaxed text-ink/85">${cur.reason}</div>
    </section>`;

  // 新增证据
  const evidenceCard = (cur.evidence && cur.evidence.length) ? `
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          新增证据（${cur.evidence.length}）
        </h2>
      </div>
      <div class="p-5 space-y-2">
        ${cur.evidence.map(e => `
          <div class="flex items-center gap-3 p-2 border border-border rounded hover:bg-bg/40">
            <span class="text-base">📎</span>
            <span class="flex-1 text-sm">${e.name}</span>
            <span class="text-[11px] text-muted num">${e.size}</span>
            <span class="text-[10px] text-muted num">${e.uploadedAt}</span>
            <button onclick="toast('已下载','success')" class="text-[11px] text-brand-600 hover:underline">下载</button>
          </div>
        `).join('')}
      </div>
    </section>
  ` : '';

  // 信评委安排
  const committeeCard = cur.committee ? `
    <section class="bg-white rounded-lg shadow-card mb-5 ${cur.committee.outcome ? 'border-l-4 border-success' : 'border-l-4 border-brand-600'}">
      <div class="px-5 py-3 border-b border-border flex items-center justify-between">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 ${cur.committee.outcome ? 'bg-success' : 'bg-brand-600'} rounded"></span>
          信评委${cur.committee.outcome ? '审议结果' : '安排'}
        </h2>
        <span class="text-[11px] num text-muted">${cur.committee.date}</span>
      </div>
      <div class="p-5 space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-x-6 gap-y-2">
          <div><span class="text-muted">主席：</span><strong>${cur.committee.chair}</strong></div>
          <div><span class="text-muted">参会委员：</span>${(cur.committee.members || []).length} 人</div>
        </div>
        <div>
          <span class="text-muted">委员名单：</span>
          <span class="flex flex-wrap gap-1.5 mt-1">
            ${(cur.committee.members || []).map(m => `<span class="text-[10px] px-2 py-0.5 rounded ${m.includes('回避')?'bg-bg border border-dashed text-muted':'bg-brand-50 text-brand-700 border border-brand-200'}">${m}</span>`).join('')}
          </span>
        </div>
        <div><span class="text-muted">议程：</span>${cur.committee.agenda}</div>
        ${cur.committee.outcome ? `<div class="p-3 bg-success/5 border border-success/30 rounded mt-2"><strong class="text-success">表决结果：</strong>${cur.committee.outcome}</div>` : ''}
        ${cur.committee.recordingHash ? `<div class="text-[10px] text-muted">会议录像哈希：<span class="num">${cur.committee.recordingHash}</span></div>` : ''}
      </div>
    </section>
  ` : '';

  // 历次复评时间线（同一项目通常只有一次，但保留）
  const sorted = [...projectAp].sort((a,b) => (a.filedAt < b.filedAt ? 1 : -1));
  const timelineCard = sorted.length > 1 ? `
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          本项目历次复评（${sorted.length}）
        </h2>
      </div>
      <div class="p-5 space-y-3">
        ${sorted.map(it => `
          <div class="flex items-start gap-3 pb-3 border-b border-border/50 last:border-0 last:pb-0">
            <div class="w-2 h-2 rounded-full ${it.status === 'concluded' ? 'bg-success' : 'bg-brand-500'} mt-1.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-sm font-medium">${it.id}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded ${it.status === 'concluded' ? 'bg-success/10 text-success border border-success/30' : 'bg-brand-100 text-brand-700 border border-brand-200'}">${it.status === 'concluded' ? '已结' : '进行中'}</span>
              </div>
              <div class="text-xs text-muted mt-1 leading-snug">${it.reason}</div>
              <div class="text-[10px] num text-muted mt-1">${it.filedTime || it.filedAt}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  ` : '';

  // 行动区
  const actions = `
    <section class="bg-bg/40 border border-border rounded-lg p-4 flex items-center justify-between flex-wrap gap-3">
      <div class="text-xs text-muted">
        ${isConcluded ? '复评已结案，记录已写入审计链。' : `复评进行中，下一步：${STEPS[cur.currentStep-1] ? STEPS[cur.currentStep-1].t : '—'}。`}
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        ${!isConcluded && cur.currentStep <= 4 ? '<a href="committee-vote.html" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded hover:bg-brand-700">召开信评委 →</a>' : ''}
        <button onclick="toast('复评决议书 PDF 已下载','success')" class="text-xs px-3 py-1.5 border border-border rounded hover:bg-white">下载复评决议书 PDF</button>
        ${isConcluded ? '<button onclick="toast(\'已推送至委托方与受评对象\',\'success\')" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded hover:opacity-90">通知委托方</button>' : ''}
      </div>
    </section>

    <!-- 合规说明 -->
    <section class="bg-bg/40 border border-border rounded-lg p-4 mt-5 text-xs leading-relaxed text-muted">
      <strong class="text-ink">合规与红线：</strong>
      ① 复评仅限一次（《信评委制度》第二十二条）；② 不得以更正或更新信息为由额外收取费用（GB/T 45255-2025第十一条）；
      ③ 复评等级为最终信用等级；④ 异议申诉过程不得停止评级结果披露义务。
    </section>`;

  return `
    ${noticeBanner}
    ${header}
    ${subjectCard}
    ${metaCard}
    ${flowCard}
    ${reasonCard}
    ${evidenceCard}
    ${committeeCard}
    ${timelineCard}
    ${actions}
  `;
}

function renderListView(ap) {
  const statusMap = {
    committee_scheduled: { label:'已排信评委', cls:'bg-warning/10 text-warning border-warning/30' },
    concluded:           { label:'已结复评',   cls:'bg-success/10 text-success border-success/30' }
  };
  return `
    <div class="bg-success/5 border-l-4 border-success rounded-md px-4 py-3 mb-4 text-xs leading-relaxed">
      <div class="flex items-start gap-2">
        <span class="text-success font-bold">💰 合规明示</span>
        <div class="flex-1 text-ink/85">
          <strong>GB/T 45255-2025 第十一条：</strong>第三方机构<strong class="text-success">不得以更正或更新信息为由，向企业额外收取费用</strong>。
          复评、信息更正、信用修复联动产生的重新评级一律 <strong class="text-success">免费</strong>。
        </div>
      </div>
    </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between flex-wrap gap-2">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2 flex-wrap">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            复评流程
            <span class="text-xs text-muted font-normal">FR-D-007 · 复评仅限一次</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-bg text-muted border border-border">全公司复评台账 · list view</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            按《信评委制度》：受评对象 / 委托方对评级结果有异议的，可在收到评级报告后提出复评；
            5 个工作日内召开信评委。复评仅限一次，复评等级为最终信用等级。
          </p>
        </div>
        <button onclick="newAppeal()" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700 flex-shrink-0">+ 新建复评申请</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">本年度复评申请</div><div class="num text-2xl font-bold text-brand-600 mt-1">${ap.length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">进行中</div><div class="num text-2xl font-bold text-warning mt-1">${ap.filter(a=>a.status==='committee_scheduled').length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">已结复评</div><div class="num text-2xl font-bold text-brand-700 mt-1">${ap.filter(a=>a.status==='concluded').length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">维持原等级</div><div class="num text-2xl font-bold text-success mt-1">${ap.filter(a=>a.conclusion==='维持原等级').length}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">采纳调整</div><div class="num text-2xl font-bold text-warning mt-1">${ap.filter(a=>a.conclusion && a.conclusion.includes('调整')).length}</div></div>
      </div>
    </section>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
        <span class="w-1 h-4 bg-brand-600 rounded"></span>
        复评流程（合规流转）
      </h3>
      <div class="grid grid-cols-7 gap-2 items-center text-center">
        ${STEPS.map((s, i) => `
          <div class="flex items-center gap-1">
            <div class="border border-border rounded-lg p-3 flex-1 hover:border-brand-300 hover:bg-brand-50/30">
              <div class="num text-xl font-bold text-brand-600">${s.n}</div>
              <div class="text-xs font-medium mt-1">${s.t}</div>
              <div class="text-[10px] text-muted leading-snug mt-1">${s.d}</div>
            </div>
            ${i < STEPS.length - 1 ? '<span class="text-muted">→</span>' : ''}
          </div>
        `).join('')}
      </div>
    </section>

    <section class="bg-white rounded-lg shadow-card">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          复评申请记录（${ap.length}）
        </h3>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">编号</th>
          <th class="py-2">受评对象</th>
          <th class="py-2">提交日期</th>
          <th class="py-2">理由 / 新增证据</th>
          <th class="py-2">状态</th>
          <th class="py-2">信评委日期</th>
          <th class="py-2">复评结论</th>
          <th class="py-2 pr-4 text-right">操作</th>
        </tr></thead>
        <tbody class="divide-y divide-border">
          ${ap.map(a => {
            const s = statusMap[a.status] || { label:a.status, cls:'' };
            const proj = a.project || (((MockData.projects || []).find(pp => pp.subject === a.subject) || {}).id);
            return `
              <tr class="hover:bg-bg">
                <td class="px-4 py-2.5 num text-xs">${a.id}</td>
                <td class="text-sm font-medium">${a.subject}</td>
                <td class="text-xs num text-muted">${a.filedAt}</td>
                <td class="text-xs leading-snug max-w-md">${a.reason}</td>
                <td><span class="text-xs px-2 py-0.5 rounded-full border ${s.cls}">${s.label}</span></td>
                <td class="text-xs num text-muted">${a.committeeAt || '—'}</td>
                <td class="text-xs ${a.conclusion && a.conclusion.includes('调整')?'text-warning font-medium':a.conclusion==='维持原等级'?'text-success':'text-muted'}">${a.conclusion || '—'}</td>
                <td class="text-right pr-4">
                  ${proj ? `<a href="appeal-flow.html?projectId=${proj}" class="text-xs text-brand-600 hover:underline">详情 →</a>` : '<span class="text-xs text-muted">—</span>'}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </section>

    <section class="bg-bg/40 border border-border rounded-lg p-4 mt-5 text-xs leading-relaxed text-muted">
      <strong class="text-ink">合规与红线：</strong>
      ① 复评仅限一次（《信评委制度》第二十二条）；② 不得以更正或更新信息为由额外收取费用（GB/T 45255-2025第十一条）；
      ③ 复评等级为最终信用等级；④ 异议申诉过程不得停止评级结果披露义务。
    </section>
  `;
}

function newAppeal() {
  const p = (typeof getCurrentProject === 'function') ? getCurrentProject() : null;
  openModal({
    title: '新建复评申请' + (p ? ` · ${p.subject}` : ''),
    width: 'max-w-xl',
    content: `
      <form class="space-y-3 text-sm">
        <div><label class="text-xs text-muted">受评对象 <span class="text-danger">*</span></label>
          <input class="mt-1 block w-full px-3 py-2 border border-border rounded-md text-sm" value="${p ? p.subject : ''}" placeholder="主体名称或 USCC..." />
        </div>
        <div><label class="text-xs text-muted">异议类型 <span class="text-danger">*</span></label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md text-sm">
            <option>对市场化等级有异议</option>
            <option>对融合等级有异议</option>
            <option>对评级展望有异议</option>
            <option>对评级理由有异议</option>
          </select>
        </div>
        <div><label class="text-xs text-muted">异议理由与新增证据 <span class="text-danger">*</span></label>
          <textarea rows="4" class="mt-1 block w-full px-3 py-2 border border-border rounded-md text-sm" placeholder="请说明异议要点并附新增证据清单..."></textarea>
        </div>
        <div class="text-[11px] text-muted">提交后系统将自动调取原评级底稿，并 5 个工作日内排定信评委审议。</div>
      </form>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded">取消</button>
      <button onclick="closeModal();toast('复评申请已提交 · 信评委将于 5 个工作日内召开','success')" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded">提交</button>
    `
  });
}

function viewAppeal(id) {
  const a = MockData.appeals.find(x => x.id === id);
  if (!a) return;
  openModal({
    title: '复评详情：' + a.id,
    width: 'max-w-lg',
    content: `
      <div class="space-y-2 text-sm">
        <div><span class="text-muted">主体：</span>${a.subject}</div>
        <div><span class="text-muted">提交：</span><span class="num">${a.filedAt}</span></div>
        <div><span class="text-muted">理由：</span>${a.reason}</div>
        <div><span class="text-muted">结论：</span>${a.conclusion || '—'}</div>
      </div>
    `,
    footer: '<button onclick="closeModal()" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded">关闭</button>'
  });
}

mountLayout('appeal-flow', renderMain);
</script>
</body>
</html>
