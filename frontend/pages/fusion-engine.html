<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>公共信用融合引擎 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260511b"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260511b" />
<meta http-equiv="Cache-Control" content="no-store" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260511b"></script>
<script src="../assets/js/mock-data.js?v=20260511b"></script>
<script src="../assets/js/copy-corpus.js?v=20260511b"></script>
<script src="../assets/js/common.js?v=20260511b"></script>
<script src="../assets/js/layout.js?v=20260511b"></script>
<script src="../assets/js/prompts.js?v=20260511b"></script>
<script src="../assets/js/ai-agent.js?v=20260511b"></script>
<script>
/* ============== 公共信用融合引擎（FR-C-005 · SRS §3.8）============== */
function renderMain() {
  const rules = MockData.fusionMappingRules;
  return `
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            公共信用融合引擎
            <span class="text-xs text-muted font-normal">FR-C-005 · SRS §3.8</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            按GB/T 45255-2025 + GB/T 45255-2025 顶层设计，将公共信用 ABCD 等级及八大维度数据按预设规则
            融入 BACP / AM / 外部支持；明确权重、阈值、特殊规则（如 D 级 → 不得评 A 级）。
          </p>
        </div>
        <button onclick="askAIFusion()" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded-md hover:opacity-90">AI 助手</button>
      </div>
    </section>

    <!-- 红线规则（强制约束）-->
    <section class="bg-danger/5 border-2 border-danger/40 rounded-lg p-5 mb-5">
      <div class="flex items-start gap-3">
        <span class="text-3xl">🚨</span>
        <div class="flex-1">
          <div class="text-base font-bold text-danger">硬性约束（红线）</div>
          <div class="text-sm text-ink/90 mt-1 leading-relaxed">
            <strong>公共信用为 D 级的，行业信用评价不得评为 A 级（含 AAA、AA+、AA、AA-、A+、A、A-）。</strong>
          </div>
          <div class="text-xs text-muted mt-2">
            来源：GB/T 45255-2025《关于建立企业信用状况综合评价体系的实施方案》第六条
          </div>
        </div>
      </div>
    </section>

    <!-- ABCD ↔ AAA-C 映射 -->
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          ABCD ↔ AAA-C 映射模型
        </h3>
      </div>
      <div class="px-5 py-3 bg-bg/40 border-b border-border text-[11px] text-muted leading-relaxed">
        ⓘ 左列 ABCD 是<strong class="text-ink/85">远东资信按 GB/T 45255-2025《公共信用综合评价规范》</strong>，
        基于信用中国披露的失信被执行 / 严重失信主体名单 / 经营异常等事实条目计算得出的综合评价等级，
        <strong class="text-warning">非信用中国官方等级</strong>（信用中国本身不打分、不出等级）。
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">公共信用综合评价</th>
          <th class="py-2">市场化最高上限</th>
          <th class="py-2">软性参考调整</th>
          <th class="py-2">说明</th>
        </tr></thead>
        <tbody class="divide-y divide-border">
          ${rules.map(r => `
            <tr class="hover:bg-bg ${r.pubGrade==='D'?'bg-danger/5':''}">
              <td class="px-4 py-3">${publicGradeBadge(r.pubGrade, { large:false })}</td>
              <td>${gradeBadge(r.marketCap)}</td>
              <td class="text-xs num ${r.soft.startsWith('+')?'text-success':r.soft.startsWith('-')?'text-warning':'text-muted'}">${r.soft}</td>
              <td class="text-xs text-muted leading-snug">${r.note}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>

    <!-- 八大维度权重明示（评级标准委员会审议留痕）-->
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border flex items-center justify-between">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          GB/T 45255-2025 八大维度权重表（远东工商企业适用）
        </h3>
        <span class="text-xs text-muted">权重审议留痕：评级标准委员会 2024-09-15 通过</span>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">维度</th>
          <th class="py-2">含义</th>
          <th class="py-2">数据来源</th>
          <th class="py-2 text-center">基础权重</th>
          <th class="py-2 text-center">行业系数（钢铁示例）</th>
          <th class="py-2 text-center">最终权重</th>
        </tr></thead>
        <tbody class="divide-y divide-border text-xs">
          ${MockData.eightDimensions.map(d => `
            <tr class="hover:bg-bg">
              <td class="px-4 py-2 font-medium">${d.name} <span class="text-[10px] text-muted">(${d.code})</span></td>
              <td class="text-muted leading-snug">${d.desc}</td>
              <td class="text-muted leading-snug">${d.dataSource}</td>
              <td class="text-center num">${(d.weight*100).toFixed(0)}%</td>
              <td class="text-center text-muted">×1.00</td>
              <td class="text-center num font-semibold text-brand-600">${(d.weight*100).toFixed(0)}%</td>
            </tr>
          `).join('')}
          <tr class="bg-bg/40">
            <td colspan="3" class="px-4 py-2 text-right text-xs font-semibold">合计</td>
            <td class="text-center num font-bold">100%</td>
            <td></td>
            <td class="text-center num font-bold text-brand-600">100%</td>
          </tr>
        </tbody>
      </table>
      <div class="px-5 py-3 border-t border-border bg-bg/40 text-[11px] text-muted leading-relaxed">
        <strong>政策依据 + 合规审议：</strong>权重设置依据GB/T 45255-2025第六条"具体权重根据实际情况确定"；
        每年至少由评级标准委员会审查一次（《评级方法、模型与程序的生效改进定期审查制度》）；
        不同行业（如保险 / 银行 / 证券 / 城投）有各自独立的权重配比，详见
        <a href="methodology-version.html" class="text-brand-600 hover:underline">技术与标准 → 方法版本管理</a>。
      </div>
    </section>

    <!-- 八大维度融入 BACP / AM 应用切点 -->
    <section class="bg-white rounded-lg shadow-card mb-5">
      <div class="px-5 py-3 border-b border-border">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          八大维度融入 BACP / AM 切点
        </h3>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="th text-left">
          <th class="px-4 py-2">公共信用维度（GB/T 45255）</th>
          <th class="py-2">BACP / AM 切点</th>
          <th class="py-2">具体规则</th>
          <th class="py-2 text-center">强制级别</th>
        </tr></thead>
        <tbody class="divide-y divide-border text-xs">
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">司法裁判</td>
            <td>AM · 或有风险 / 历史信用记录</td>
            <td class="text-muted">未结案的失信被执行人 → 扣 0.5 子级</td>
            <td class="text-center"><span class="text-danger">强制</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">行政监管</td>
            <td>AM · 历史信用记录 / 风险管理</td>
            <td class="text-muted">重大行政处罚 → 按金额阶梯扣分</td>
            <td class="text-center"><span class="text-danger">强制</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">履约践诺</td>
            <td>BACP · 业务状况</td>
            <td class="text-muted">合同履约率 ≥ 95% 加 0.25 子级；&lt; 80% 扣 0.5</td>
            <td class="text-center"><span class="text-danger">强制</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">经营管理</td>
            <td>BACP · 业务状况 / 偿付能力</td>
            <td class="text-muted">公司治理评分 / 信用管理体系</td>
            <td class="text-center"><span class="text-danger">强制</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">发展创新</td>
            <td>AM · 预期调整因素</td>
            <td class="text-muted">高新企业 / 专精特新可加 0.25 子级</td>
            <td class="text-center"><span class="text-warning">建议</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">守信激励</td>
            <td>AM · 历史信用记录 / 预期</td>
            <td class="text-muted">国家级守信红名单可加 0.5 子级</td>
            <td class="text-center"><span class="text-warning">建议</span></td>
          </tr>
          <tr class="hover:bg-bg bg-danger/5">
            <td class="px-4 py-2 font-medium">失信惩戒</td>
            <td>红线 + AM · 或有风险</td>
            <td class="text-muted">严重失信主体名单 → 触发 D 级红线</td>
            <td class="text-center"><span class="text-danger font-semibold">红线</span></td>
          </tr>
          <tr class="hover:bg-bg">
            <td class="px-4 py-2 font-medium">社会监督</td>
            <td>AM · ESG / 历史信用记录</td>
            <td class="text-muted">舆情负面 + 监管确认 → 阶梯扣分</td>
            <td class="text-center"><span class="text-warning">建议</span></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- 当前主体融合结果 -->
    <section class="bg-white rounded-lg shadow-card p-5">
      <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
        <span class="w-1 h-4 bg-brand-600 rounded"></span>
        当前主体融合结果（南京钢铁联合有限公司）
      </h3>
      <div class="grid grid-cols-4 gap-4">
        <div class="border border-border rounded p-3 text-center">
          <div class="text-xs text-muted">公共信用综合评价</div>
          <div class="mt-1">${publicGradeBadge('B', { large:true })}</div>
          <div class="text-[10px] text-muted mt-2">基本诚信（良级）<br/><span class="text-warning">GB/T 45255-2025，非信用中国官方</span></div>
        </div>
        <div class="border border-border rounded p-3 text-center">
          <div class="text-xs text-muted">硬性约束</div>
          <div class="text-sm font-bold text-success mt-1">无</div>
          <div class="text-[10px] text-muted mt-2">未触发 D 级红线</div>
        </div>
        <div class="border border-border rounded p-3 text-center">
          <div class="text-xs text-muted">软性参考调整</div>
          <div class="num text-2xl font-bold text-muted mt-1">0</div>
          <div class="text-[10px] text-muted mt-2">B 级保持基准</div>
        </div>
        <div class="border-2 border-gold rounded p-3 text-center bg-gradient-to-br from-yellow-50 to-amber-100 glow-gold">
          <div class="text-xs text-gold font-semibold">融合后等级</div>
          <div class="num text-2xl font-bold text-gold mt-1">${MockData.gradeDerivation.finalGrade}</div>
          <div class="text-[10px] text-muted mt-2">主体信用等级（待信评委）</div>
        </div>
      </div>
      <div class="mt-4 flex items-center justify-between bg-bg/40 -mx-5 -mb-5 px-5 py-3 border-t border-border">
        <a href="am-adjustment.html" class="text-xs px-3 py-1.5 border border-border rounded hover:bg-bg">← 返回 AM</a>
        <a href="grade-mapping.html" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded hover:bg-brand-700">下一步：等级映射 →</a>
      </div>
    </section>
  `;
}

function askAIFusion() {
  const dims = MockData.eightDimensions;
  const ctx = '【八大维度权重】\n' +
              dims.map(d => '· ' + d.name + ' ' + (d.weight*100).toFixed(0) + '% · ' + d.metrics).join('\n') + '\n' +
              '【当前主体】南京钢铁联合有限公司 · 公共信用 B 级\n【红线状态】未触发 D 级硬性约束';
  AIAgent.setScene('cross-domain-translate');
  AIAgent.send('请基于上述八大维度配置，逐一翻译公共信用扣分项 → BACP/AM 调整因子：① 列出每个维度的扣 / 加分事件 ② 行业敏感系数 ③ PD/LGD 调整数值或区间 ④ 现金流年化影响 ⑤ 评级师采纳/否决/修改建议（含理由）。', ctx);
}

mountLayout('fusion-engine', renderMain);
</script>
</body>
</html>
