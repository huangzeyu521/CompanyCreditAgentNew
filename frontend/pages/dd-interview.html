function renderMain() {

    ${(function(){

        return `<div class="bg-warning/10 border border-warning/30 rounded-md px-4 py-3 mb-4 text-sm text-warning flex items-center gap-2">

      return `<div class="bg-brand-50/60 border border-brand-200 rounded-md px-4 py-3 mb-4 flex items-center justify-between flex-wrap gap-2">
        <div class="text-sm">
          <span class="text-muted">当前项目：</span>
          <strong class="text-brand-700">${p.subject}</strong>
          <span class="text-xs text-muted ml-2">(${p.id} · ${p.industry || '—'})</span>
        </div>
        <a href="project-workbench.html?projectId=${p.id}" class="text-xs text-brand-600 hover:underline">← 返回项目工作台</a>
      </div>`;
    })()}

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>

          <p class="text-xs text-muted mt-2 leading-relaxed">
            访谈计划、对象、提纲、时间、地点、是否实地的全流程管理；
            ASR 录音自动转写为文字（支持发言人区分、敏感词识别、关键风险点自动标注）；输出可签字访谈记录。
          </p>
        </div>
        <button onclick="askAIInterview()" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded-md hover:opacity-90">AI 助手</button>

        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">实地访谈</div><div class="num text-2xl font-bold text-success mt-1">${list.filter(i=>i.mode==='on-site').length}</div></div>
      </div>
    </section>

    <!-- Tab -->
    <section class="bg-white rounded-lg shadow-card">
      <div class="border-b border-border flex">

        <button onclick="switchTab('outline')" class="px-4 py-2.5 text-xs ${currentTab==='outline'?'border-b-2 border-brand-600 text-brand-700 font-medium':'text-muted hover:text-ink'}">访谈提纲（自动生成）</button>
      </div>
      <div id="tab-content" class="p-5">${renderTab()}</div>
    </section>
  `;
}

function renderTab() {
  if (currentTab === 'list') return renderList();
  if (currentTab === 'upload') return renderUpload();
  if (currentTab === 'record') return renderRecord();
  return renderOutline();
}

/* ===== 录音上传 + ASR 转写流程（P1-4 增强）===== */
function renderUpload() {
  return `
    <div class="space-y-5">
      <!-- 上传区 -->
      <div class="grid grid-cols-2 gap-5">
        <div>
          <div class="text-xs text-muted mb-2">关联访谈</div>
          <select class="w-full px-3 py-2 border border-border rounded-md text-sm">

          </select>
          <div class="border-2 border-dashed border-border rounded-lg p-8 text-center mt-4 hover:border-brand-300 cursor-pointer" onclick="uploadAudio()">
            <div class="text-4xl text-muted mb-2">🎙️</div>
            <div class="text-sm font-medium">上传访谈录音</div>
            <div class="text-xs text-muted mt-1">支持 .mp3 / .wav / .m4a / .flac / .ogg · 单份 ≤ 200 MB · 时长 ≤ 4 小时</div>
            <div class="text-[10px] text-muted mt-2">现场录音建议直接用智能体 APP 录制并上传（自动加密 + GPS 留痕）</div>
          </div>
          <div class="text-xs text-muted mt-3 leading-relaxed">

            原始录音保留 ≥ 15 年（《档案管理制度》）。
          </div>
        </div>
        <div>
          <div class="text-xs text-muted mb-2">ASR 引擎参数</div>
          <div class="space-y-3 text-xs">
            <div class="flex items-center justify-between border border-border rounded p-3">
              <div><div class="font-medium">语种 / 方言</div><div class="text-[10px] text-muted">支持普通话 + 主流方言</div></div>
              <select class="text-xs px-2 py-1 border border-border rounded"><option>普通话（标准）</option><option>江苏方言</option><option>粤语</option><option>四川方言</option></select>
            </div>
            <div class="flex items-center justify-between border border-border rounded p-3">
              <div><div class="font-medium">发言人区分</div><div class="text-[10px] text-muted">声纹识别区分多说话人</div></div>
              <input type="checkbox" checked />
            </div>
            <div class="flex items-center justify-between border border-border rounded p-3">
              <div><div class="font-medium">敏感词识别</div><div class="text-[10px] text-muted">"承诺级别"等违规词</div></div>
              <input type="checkbox" checked />
            </div>
            <div class="flex items-center justify-between border border-border rounded p-3">
              <div><div class="font-medium">关键风险点自动标注</div><div class="text-[10px] text-muted">基于 AI 助手识别</div></div>
              <input type="checkbox" checked />
            </div>
            <div class="flex items-center justify-between border border-border rounded p-3">
              <div><div class="font-medium">原始录音留存</div><div class="text-[10px] text-muted">加密存储 ≥ 15 年（强制）</div></div>
              <input type="checkbox" checked disabled />

        </div>
      </div>

      <div class="bg-bg/40 border border-border rounded-lg p-4">

          ${[
            { n:'①', t:'录音上传', d:'加密上传', done:true },
            { n:'②', t:'ASR 转写', d:'引擎调用中', done:true },
            { n:'③', t:'发言人区分', d:'声纹分离', done:true },
            { n:'④', t:'风险标注', d:'AI 智能标注', done:true },
            { n:'⑤', t:'受访人签字', d:'电子签字确认', done:false }

        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-semibold">ASR 转写结果（实时）</div>
          <div class="flex gap-2">
            <button onclick="toast('已下载 SRT 字幕','success')" class="text-xs px-3 py-1 border border-border rounded hover:bg-bg">下载 SRT</button>
            <button onclick="toast('已发送给受访人电子签字（链接 + 短信验证）','success')" class="text-xs px-3 py-1 bg-brand-600 text-white rounded hover:bg-brand-700">发送签字</button>
          </div>
        </div>
        <div class="border border-border rounded p-3 bg-bg/40 text-xs leading-relaxed max-h-60 overflow-y-auto space-y-2">
          <div><span class="text-muted num">[00:00:12]</span> <span class="text-brand-700 font-medium">分析师 王明远：</span>请介绍贵公司近三年的盈利情况。</div>

          <div><span class="text-muted num">[00:00:35]</span> <span class="text-brand-700 font-medium">分析师 王明远：</span>2025 年现金流相比 2024 下降明显，请问主要原因？</div>

          <div><span class="text-muted num">[00:01:15]</span> <span class="text-success font-medium">受访人 · CFO（脱敏）：</span>长期占 62%，短期占 38%。<span class="bg-danger/30 px-1 rounded">关键风险点 #2：短期债务集中到期</span></div>

          <span>转写引擎：远东资信私有 ASR · 加密哈希 0x4f...c7d2</span>
        </div>
      </div>
    </div>
  `;

function uploadAudio() {
  toast('演示模式：选择本地 .wav 文件后将自动加密上传 + 启动 ASR 引擎', 'info', 2000);
}

function renderList() {
  const list = MockData.ddInterviews;

    <div class="space-y-3">

            <div class="w-10 h-10 rounded-full ${i.mode==='on-site'?'bg-success/10 text-success':'bg-brand-100 text-brand-700'} flex items-center justify-center text-xs font-semibold flex-shrink-0">
              ${i.mode==='on-site'?'实地':'远程'}
            </div>
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <div class="text-sm font-medium">${i.topic}</div>
                <div class="flex items-center gap-2">
                  ${i.transcribed?'<span class="text-xs px-1.5 py-0.5 rounded bg-success/10 text-success border border-success/30">已转写</span>':''}
                  ${i.riskFlags>0?`<span class="text-xs px-1.5 py-0.5 rounded bg-warning/10 text-warning border border-warning/30">${i.riskFlags} 风险点</span>`:''}
                </div>
              </div>
              <div class="text-xs text-muted mt-1">
                <span>${i.when}</span> · <span>${i.durationMin} 分钟</span> · <span>${i.location}</span>
              </div>
              <div class="text-xs mt-2 text-ink/85 leading-relaxed">${i.summary}</div>
              <div class="flex items-center gap-3 mt-2">
                <button onclick="switchTab('record')" class="text-xs text-brand-600 hover:underline">查看转写 →</button>
                <button onclick="toast('已通过电子签章发送给受访人','success')" class="text-xs text-brand-600 hover:underline">发送签字 →</button>
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function switchTab(t) {
  currentTab = t;
  document.getElementById('app').innerHTML = '';
  mountLayout('dd-interview', renderMain);
}

function askAIInterview() {
  const list = MockData.ddInterviews;
  const ctx = '【本项目访谈】' + list.length + ' 场 · 已转写 ' + list.filter(i=>i.transcribed).length + ' 场\n' +
              '【关键风险点标注】' + list.reduce((s,i)=>s+i.riskFlags,0) + ' 处\n' +
              '【访谈记录】' + list.map(i => '· ' + i.topic + '（' + i.durationMin + '分）：' + i.summary).join('\n');
  AIAgent.setScene('dd-checklist-gen');
  AIAgent.send('请基于以上访谈内容：① 关键风险点提炼 TOP5（含原文证据）② 受访人观点的可信度评估 ③ 缺失访谈对象建议（哪些岗位还需补充访谈）④ 后续问询提纲建议 ⑤ 评级师可信判断（基于访谈对评级的支持/反对）。', ctx);
}
