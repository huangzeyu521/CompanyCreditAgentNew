<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的报告库 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
let _filter = { search: '', type: 'all', status: 'all' };
let _page = 1;
const _pageSize = 8;

function renderMain() {
  const reports = applyFilter();
  const total = reports.length;
  const totalPages = Math.max(1, Math.ceil(total / _pageSize));
  const pageData = reports.slice((_page-1)*_pageSize, _page*_pageSize);

  return `
    <!-- 数据来源 / 演示性质声明 -->
        <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
          <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span><strong class="text-ink">数据声明：</strong>本页面"主体名称、统一社会信用代码、注册地址、法定代表人、注册资本、上市状态、行业类别"等<strong>事实型字段</strong> 100% 来自公开资料（国家企业信用信息公示系统 / 上市公司年报 / 信用中国 / 企业官网 / 远东资信公开评级报告）；"信用等级、KPI、流水编号、调用次数、订阅时间、扣分事件、PD / LGD 调整、合规命中"等<strong>运营字段</strong>为 CCASCEA 智能体演示数据，仅供产品功能展示。</span>
        </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between mb-4 flex-wrap gap-3">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            我的报告库
            <span class="text-xs text-muted font-normal">· 共 ${MockData.reports.length} 份评级报告</span>
          </h1>
          <p class="text-sm text-muted mt-1">所有评级报告永久归档；版本化管理；支持时间点回溯。</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="exportList()" class="text-xs px-3 py-1.5 border border-border rounded-md hover:bg-bg">导出列表</button>
          <a href="subject-rating.html" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700">+ 新建评级</a>
        </div>
      </div>

      <!-- 筛选栏 -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <div class="md:col-span-2">
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-2.5 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-3.5-3.5"/></svg>
            <input type="text" placeholder="搜索主体名称 / 报告编号 / 统一社会信用代码..." value="${_filter.search}"
              oninput="updateFilter('search', this.value)"
              class="w-full pl-9 pr-3 py-2 text-sm border border-border rounded-md focus:outline-none focus:border-accent" />
          </div>
        </div>
        <div>
          <select onchange="updateFilter('type', this.value)" class="w-full px-3 py-2 text-sm border border-border rounded-md focus:outline-none focus:border-accent">
            <option value="all">全部类型</option>
            <option value="主体首次">主体首次</option>
            <option value="主体跟踪">主体跟踪</option>
            <option value="债项评级">债项评级</option>
            <option value="跟踪评级">跟踪评级</option>
          </select>
        </div>
        <div>
          <select onchange="updateFilter('status', this.value)" class="w-full px-3 py-2 text-sm border border-border rounded-md focus:outline-none focus:border-accent">
            <option value="all">全部状态</option>
            <option value="published">已发布</option>
            <option value="review">待复核</option>
            <option value="fused">D级熔断</option>
          </select>
        </div>
      </div>

      <!-- 表格 -->
      <div class="overflow-x-auto border border-border rounded-lg">
        <table class="w-full text-sm">
          <thead>
            <tr class="th text-left">
              <th class="px-4 py-2.5">报告编号</th>
              <th class="py-2.5">主体名称</th>
              <th class="py-2.5">类型</th>
              <th class="py-2.5 text-center">公共</th>
              <th class="py-2.5 text-center">市场化</th>
              <th class="py-2.5 text-center">融合</th>
              <th class="py-2.5">状态</th>
              <th class="py-2.5">更新时间</th>
              <th class="py-2.5 pr-4 text-right">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-border">
            ${pageData.length === 0 ? '<tr><td colspan="9" class="text-center py-12 text-muted">暂无符合条件的报告</td></tr>' : pageData.map(r => {
              const isFused = r.status === 'fused';
              const statusMap = {
                published: { cls:'bg-success/10 text-success border-success/30', label:'已发布' },
                review:    { cls:'bg-warning/10 text-warning border-warning/30', label:'待复核' },
                fused:     { cls:'bg-danger/10 text-danger border-danger/30',    label:'D级熔断' }
              };
              const s = statusMap[r.status] || statusMap.published;
              return `
                <tr class="hover:bg-bg ${isFused ? 'bg-danger/5' : ''}">
                  <td class="px-4 py-3 num text-xs">${r.id}</td>
                  <td class="font-medium">${r.subject}</td>
                  <td class="text-xs text-muted">${r.type}</td>
                  <td class="text-center">${gradeBadge(r.public)}</td>
                  <td class="text-center">${gradeBadge(r.market)}</td>
                  <td class="text-center">${gradeBadge(r.fusion, { withFuse: isFused })}</td>
                  <td><span class="text-xs px-2 py-0.5 rounded-full border ${s.cls}">${s.label}</span></td>
                  <td class="text-xs text-muted">${r.updatedAt}</td>
                  <td class="text-right pr-4">
                    <a href="report-detail.html?id=${r.id}" class="text-xs ${isFused ? 'text-danger' : 'text-brand-600'} hover:underline">查看</a>
                    <span class="mx-1 text-border">|</span>
                    <button onclick="toast('正在导出 ${r.id}','info')" class="text-xs text-brand-600 hover:underline">下载</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="mt-4 flex items-center justify-between flex-wrap gap-2 text-sm">
        <div class="text-xs text-muted">显示 <span class="num">${(_page-1)*_pageSize + 1}</span> - <span class="num">${Math.min(_page*_pageSize, total)}</span> / 共 <span class="num">${total}</span> 条</div>
        <div class="flex items-center gap-1">
          <button ${_page===1?'disabled':''} onclick="goPage(${_page-1})" class="px-2.5 py-1 text-xs border border-border rounded disabled:opacity-40 disabled:cursor-not-allowed hover:bg-bg">上一页</button>
          ${Array.from({length: totalPages}, (_,i) => `<button onclick="goPage(${i+1})" class="px-2.5 py-1 text-xs border ${_page===i+1?'bg-brand-600 text-white border-brand-600':'border-border hover:bg-bg'} rounded">${i+1}</button>`).join('')}
          <button ${_page===totalPages?'disabled':''} onclick="goPage(${_page+1})" class="px-2.5 py-1 text-xs border border-border rounded disabled:opacity-40 disabled:cursor-not-allowed hover:bg-bg">下一页</button>
        </div>
      </div>
    </section>
  `;
}

function applyFilter() {
  return MockData.reports.filter(r => {
    if (_filter.type !== 'all' && r.type !== _filter.type) return false;
    if (_filter.status !== 'all' && r.status !== _filter.status) return false;
    if (_filter.search && !r.subject.includes(_filter.search) && !r.id.includes(_filter.search)) return false;
    return true;
  });
}
function updateFilter(k, v) {
  _filter[k] = v;
  _page = 1;
  refresh();
}
function goPage(p) {
  _page = p;
  refresh();
}
function refresh() {
  document.getElementById('app').innerHTML = '';
  mountLayout('reports', renderMain);
}

function exportList() {
  const data = applyFilter();
  // 生成 CSV
  const header = ['报告编号','主体名称','类型','公共信用','市场化','融合','状态','更新时间'];
  const statusZh = { published: '已发布', review: '待复核', fused: 'D级熔断' };
  const rows = data.map(r => [r.id, r.subject, r.type, r.public, r.market, r.fusion, statusZh[r.status]||r.status, r.updatedAt]);
  const csv = '﻿' + [header, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `CCASCEA-报告库-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${data.length} 条报告记录（CSV）`, 'success');
}
mountLayout('reports', renderMain);
</script>
</body>
</html>
