<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户尽调 KYC · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260511b"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260511b" />
<meta http-equiv="Cache-Control" content="no-store" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260511b"></script>
<script src="../assets/js/mock-data.js?v=20260511b"></script>
<script src="../assets/js/copy-corpus.js?v=20260511b"></script>
<script src="../assets/js/common.js?v=20260511b"></script>
<script src="../assets/js/layout.js?v=20260511b"></script>
<script src="../assets/js/prompts.js?v=20260511b"></script>
<script src="../assets/js/ai-agent.js?v=20260511b"></script>
<script>
let _kycSubject = null;

function renderMain() {
  const p = (typeof getCurrentProject === 'function') ? getCurrentProject() : null;
  // 项目模式：自动锁定本项目主体
  let lockedSubject = null;
  if (p) {
    lockedSubject = MockData.subjects.find(s => s.name === p.subject) || null;
    if (lockedSubject) _kycSubject = lockedSubject;
  }
  const opts = MockData.subjects.map(s => `<option value="${s.uscc}" ${lockedSubject && lockedSubject.uscc === s.uscc ? 'selected' : ''}>${s.name}</option>`).join('');
  const header = p
    ? `<h1 class="text-lg font-semibold flex items-center gap-2 mb-4 flex-wrap"><span class="w-1 h-5 bg-brand-600 rounded"></span><span class="text-brand-700">${p.subject}</span><span class="text-muted">·</span>公共信用快查<span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">项目级</span></h1>`
    : `<h1 class="text-lg font-semibold flex items-center gap-2 mb-4"><span class="w-1 h-5 bg-brand-600 rounded"></span>客户尽调 KYC · 10秒快速画像</h1>`;
  const desc = p
    ? `<p class="text-sm text-muted mb-2 leading-relaxed">已锁定本项目主体 <strong class="text-ink">${p.subject}</strong>。可直接生成画像，或切换其它主体做对比快查。</p>
       <p class="text-[11px] text-muted/80 mb-5 leading-relaxed">⚠ 本页基于<strong class="text-ink/85">信用中国官方报告事实条目</strong>做承接判定，<strong class="text-ink/85">不对主体打分、不输出 A/B/C/D 等级</strong>（信用中国本身就是事实披露平台，无评分）。判定依据：是否被列入严重失信主体名单 / 失信被执行人 / 经营异常名录等真实状态。</p>`
    : `<p class="text-sm text-muted mb-2 leading-relaxed">面向评级业务承接前的快速判断：基于<strong class="text-ink/85">信用中国官方报告</strong>的失信被执行 / 严重失信 / 经营异常等真实条目，给出"建议承接 / 谨慎承接 / 不建议承接"结论。</p>
       <p class="text-[11px] text-muted/80 mb-5 leading-relaxed">⚠ 信用中国为事实披露平台，<strong class="text-ink/85">不对主体打分、不出 A/B/C/D 等级</strong>。本页判定基于真实事实条目（参见每个主体的<a href="subject-rating.html?step=2" class="text-brand-600 hover:underline">完整公共信用报告</a>）。</p>`;
  const main = `
    <section class="bg-white rounded-lg shadow-card p-6 mb-5">
      ${header}
      ${desc}

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="text-xs text-muted">${p ? '当前主体（可切换比对）' : '输入主体名称或统一社会信用代码'}</label>
          <select id="kyc-select" onchange="doKyc(this.value)"
            class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option value="">请选择主体...</option>
            ${opts}
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="doKyc(document.getElementById('kyc-select').value)" class="w-full px-4 py-2 bg-brand-600 text-white rounded-md hover:bg-brand-700 text-sm">
            🔍 立即生成画像
          </button>
        </div>
      </div>
    </section>

    <div id="kyc-result"></div>
  `;
  // 项目模式：渲染后自动触发快查
  if (lockedSubject) setTimeout(() => renderResult(), 0);
  return main;
}

function doKyc(uscc) {
  if (!uscc) { toast('请先选择主体', 'warning'); return; }
  _kycSubject = MockData.subjects.find(s => s.uscc === uscc);
  if (!_kycSubject) { toast('未识别该主体', 'danger'); return; }
  renderResult();
  toast('画像已生成','success');
}

function renderResult() {
  const s = _kycSubject;
  if (!s) return;

  // 从信用中国官方报告抽取事实条目（不打分，全靠事实计数 + 标签）
  const r = s.officialReport || {};
  const labels = (r.labels) || (s.creditLabels) || [];
  const sum = r.summary || {};
  const adminCount   = sum['行政管理'] || 0;
  const goodCount    = sum['诚实守信'] || 0;
  const seriousCount = sum['严重失信'] || 0;
  const anomalyCount = sum['经营异常'] || 0;
  const commitCount  = sum['信用承诺'] || 0;
  const judicialCount = sum['司法判决'] || 0;
  const isSeverelyFailing = labels.includes('失信惩戒对象') || seriousCount > 0;
  const hasAnomaly = labels.includes('经营异常') || anomalyCount > 0;
  const hasFailExecutee = ((r.seriousMisconduct || []).filter(m => (m.type || '').includes('失信被执行'))).length > 0;

  // 基于事实条目的承接判定（替代虚构评分）
  let verdict;
  if (isSeverelyFailing) {
    verdict = {
      color:'danger', icon:'🔴', title:'不建议承接',
      reasons:[
        labels.includes('失信惩戒对象') ? '主体被列入"失信惩戒对象"（信用中国官方标签）' : null,
        hasFailExecutee ? '存在"失信被执行人"司法记录' : null,
        seriousCount > 0 ? `严重失信条目 ${seriousCount} 条` : null
      ].filter(Boolean),
      legal:'依据 GB/T 45255-2025 第六条：被列入严重失信主体名单 / 失信被执行人 → 市场化评级 ≤ BBB-，且原则上不应承接新业务。',
      bg:'from-red-50 to-pink-50', border:'border-danger'
    };
  } else if (hasAnomaly || adminCount > 50) {
    verdict = {
      color:'warning', icon:'🟡', title:'谨慎承接',
      reasons:[
        hasAnomaly ? `存在经营异常 ${anomalyCount} 条` : null,
        adminCount > 50 ? `行政管理条目较多（${adminCount} 条，含历史许可 / 处罚 / 登记）` : null
      ].filter(Boolean),
      legal:'存在公共信用事实风险点，建议在合同中加入特殊条款，并在尽调阶段重点核验。',
      bg:'from-amber-50 to-yellow-50', border:'border-warning'
    };
  } else {
    verdict = {
      color:'success', icon:'🟢', title:'建议承接',
      reasons:[
        labels.includes('守信激励对象') ? '主体被列入"守信激励对象"（信用中国官方标签）' : null,
        goodCount > 0 ? `诚实守信条目 ${goodCount} 条（含纳税信用 A 级 / 海关高级认证企业等）` : null,
        '无严重失信记录、无经营异常'
      ].filter(Boolean),
      legal:'公共信用状况良好，可正常承接评级业务；尽调阶段仍须按 BACP 流程做全面核验。',
      bg:'from-green-50 to-emerald-50', border:'border-success'
    };
  }

  // 8 大类全量摘要（用于诚实展示，不隐藏 0）
  const eightCategories = [
    { name:'行政管理',  cnt:adminCount,    icon:'📋' },
    { name:'诚实守信',  cnt:goodCount,     icon:'🌟' },
    { name:'严重失信',  cnt:seriousCount,  icon:'⚠️', danger:true },
    { name:'经营异常',  cnt:anomalyCount,  icon:'🔻', warn:true },
    { name:'信用承诺',  cnt:commitCount,   icon:'🤝' },
    { name:'信用评价',  cnt:sum['信用评价'] || 0, icon:'📊' },
    { name:'司法判决',  cnt:judicialCount, icon:'⚖️', warn:judicialCount > 0 },
    { name:'其他',      cnt:sum['其他'] || 0,    icon:'📎' }
  ];

  const html = `
    <!-- 判定结果（事实驱动）-->
    <section class="bg-gradient-to-br ${verdict.bg} border-2 ${verdict.border} rounded-lg p-6 mb-5">
      <div class="flex items-start gap-4">
        <div class="text-4xl">${verdict.icon}</div>
        <div class="flex-1">
          <div class="text-xl font-bold text-${verdict.color}">${verdict.title}</div>
          ${verdict.reasons.length ? `
            <ul class="mt-2 space-y-1 text-sm text-ink/90">
              ${verdict.reasons.map(r => `<li>· ${r}</li>`).join('')}
            </ul>
          ` : ''}
          <div class="text-xs text-ink/70 mt-3 leading-relaxed">${verdict.legal}</div>
          <div class="mt-3 flex gap-2 flex-wrap">
            ${verdict.color === 'success' ? `<a href="subject-rating.html?subject=${encodeURIComponent(s.name)}" class="text-xs px-3 py-1.5 bg-success text-white rounded hover:bg-green-700">立即启动主体评级 →</a>` : ''}
            ${verdict.color === 'warning' ? `<a href="subject-rating.html?subject=${encodeURIComponent(s.name)}" class="text-xs px-3 py-1.5 bg-warning text-white rounded">在限制条件下承接 →</a>` : ''}
            ${verdict.color === 'danger' ? `<button onclick="toast('已记录拒接理由','info')" class="text-xs px-3 py-1.5 bg-danger text-white rounded hover:bg-red-700">记录拒接理由</button>` : ''}
            <a href="subject-rating.html?subject=${encodeURIComponent(s.name)}&step=2" class="text-xs px-3 py-1.5 border border-${verdict.color}/40 text-${verdict.color} rounded hover:bg-white/60">查看完整公共信用报告 →</a>
            <button onclick="toast('已导出 KYC 报告','success')" class="text-xs px-3 py-1.5 border border-${verdict.color}/40 text-${verdict.color} rounded hover:bg-white/60">导出 KYC 报告</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 信用中国官方报告头 -->
    ${r.reportNo ? `
    <section class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
      <span class="text-success font-bold flex-shrink-0">📄</span>
      <span class="flex-1">
        <strong class="text-ink">信用中国官方报告</strong>
        · 报告编号 <span class="num">${r.reportNo}</span>
        · 出具单位 <strong class="text-ink/85">${r.issuer || '国家公共信用和地理空间信息中心'}</strong>
        · 生成时间 <span class="num">${r.generatedAt || '—'}</span>
        · 版本 ${r.version || 'V2.0'}
        ${labels.length ? `· 标签：${labels.map(l => `<span class="inline-block ml-1 text-[10px] px-1.5 py-0.5 rounded ${l === '失信惩戒对象' ? 'bg-danger/10 text-danger border border-danger/30' : l === '经营异常' ? 'bg-warning/10 text-warning border border-warning/30' : l === '守信激励对象' ? 'bg-success/10 text-success border border-success/30' : 'bg-bg text-muted border border-border'}">${l}</span>`).join('')}` : ''}
      </span>
    </section>
    ` : ''}

    <!-- 8 大类事实条目计数（替代虚构评分）-->
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          公共信用 8 大类事实条目（来自信用中国官方报告）
        </h2>
        <span class="text-[11px] text-muted">依据《公共信用信息报告标准（2022 年版）》</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${eightCategories.map(c => {
          const tone = c.danger && c.cnt > 0 ? 'bg-danger/5 border-danger/30'
                     : c.warn && c.cnt > 0 ? 'bg-warning/5 border-warning/30'
                     : c.cnt > 0 ? 'border-border' : 'border-border opacity-60';
          const numTone = c.danger && c.cnt > 0 ? 'text-danger'
                       : c.warn && c.cnt > 0 ? 'text-warning'
                       : c.cnt > 0 ? 'text-brand-700' : 'text-muted';
          return `
            <div class="border ${tone} rounded-md p-3">
              <div class="flex items-center gap-2 text-xs text-muted">
                <span>${c.icon}</span>
                <span>${c.name}</span>
              </div>
              <div class="num text-2xl font-bold ${numTone} mt-2">${c.cnt}<span class="text-xs font-normal text-muted ml-1">条</span></div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="mt-4 text-[11px] text-muted leading-relaxed">
        ⓘ 信用中国官方报告<strong class="text-ink/85">仅披露事实条目数与清单，不对主体打分、不出 A/B/C/D 等级</strong>。
        承接判定基于事实状态（如是否在严重失信主体名单、是否有失信被执行人记录）。
      </div>
    </section>

    <!-- 严重失信详情（仅当存在时展示，便于快速查看红线证据）-->
    ${(r.seriousMisconduct || []).length ? `
    <section class="bg-white rounded-lg shadow-card mb-5 border-l-4 border-danger">
      <div class="px-5 py-3 border-b border-border">
        <h2 class="text-sm font-semibold text-danger flex items-center gap-2">
          ⚠️ 严重失信记录（${r.seriousMisconduct.length} 条 · 红线证据）
        </h2>
      </div>
      <div class="p-5 space-y-3">
        ${r.seriousMisconduct.map(m => `
          <div class="border border-danger/30 bg-danger/5 rounded p-3 text-xs">
            <div class="flex items-center gap-2 mb-1 flex-wrap">
              <span class="text-sm font-semibold text-danger">${m.type || m.listType || '严重失信'}</span>
              ${m.caseNo ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-bg border border-border num">${m.caseNo}</span>` : ''}
              ${m.filingDate ? `<span class="text-[10px] text-muted num">立案：${m.filingDate}</span>` : ''}
            </div>
            ${m.court ? `<div><span class="text-muted">执行法院：</span>${m.court}</div>` : ''}
            ${m.basisDoc ? `<div><span class="text-muted">依据文书：</span><span class="num">${m.basisDoc}</span></div>` : ''}
            ${m.obligation ? `<div class="mt-1"><span class="text-muted">履行情况：</span>${m.obligation}</div>` : ''}
            ${m.behaviorType ? `<div><span class="text-muted">失信行为：</span>${m.behaviorType}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </section>
    ` : ''}

    <!-- 主体详情 -->
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="w-1 h-4 bg-brand-600 rounded"></span>主体基础信息</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <div><div class="text-xs text-muted">主体名称</div><div class="font-medium mt-1">${s.name}</div></div>
        <div><div class="text-xs text-muted">统一社会信用代码</div><div class="num font-medium mt-1">${s.uscc}</div></div>
        <div><div class="text-xs text-muted">行业</div><div class="font-medium mt-1">${s.industry}</div></div>
        <div><div class="text-xs text-muted">法定代表人</div><div class="font-medium mt-1">${s.legalRep || (r.basicInfo && r.basicInfo['法定代表人/负责人']) || '—'}</div></div>
        ${r.basicInfo ? `
        <div><div class="text-xs text-muted">企业类型</div><div class="font-medium mt-1">${r.basicInfo['企业类型'] || '—'}</div></div>
        <div><div class="text-xs text-muted">成立日期</div><div class="num font-medium mt-1">${r.basicInfo['成立日期'] || '—'}</div></div>
        <div class="md:col-span-2"><div class="text-xs text-muted">住所</div><div class="font-medium mt-1">${r.basicInfo['住所'] || '—'}</div></div>
        ` : ''}
      </div>
    </section>
  `;
  document.getElementById('kyc-result').innerHTML = html;
}

mountLayout('kyc', renderMain);
</script>
</body>
</html>
