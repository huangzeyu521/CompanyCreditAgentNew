<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>绿色债券评估认证 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
/* ============== 绿色债券评估认证（远东定制化业务） ============== */
function renderMain() {
  const gb = MockData.greenBonds;
  const stat = MockData.greenBondStats;
  const rows = gb.map(b => `
    <tr class="hover:bg-bg">
      <td class="px-4 py-2.5 num text-xs">${b.id}</td>
      <td class="text-sm font-medium">${b.issuer}</td>
      <td class="text-xs">${b.bondName}</td>
      <td class="text-xs num text-right pr-2">¥${b.amount} 亿</td>
      <td class="text-xs num">${b.duration} 年</td>
      <td class="text-xs text-muted leading-snug max-w-xs">${b.principle}</td>
      <td class="text-xs text-muted leading-snug">${b.usage.join('、')}</td>
      <td>${b.rating !== '—' ? gradeBadge(b.rating) : '<span class="text-xs text-muted">认证中</span>'}</td>
      <td>${b.greenLevel !== '—' ? `<span class="text-xs px-1.5 py-0.5 rounded bg-success/10 text-success border border-success/30">${b.greenLevel}</span>` : '<span class="text-xs text-muted">—</span>'}</td>
      <td><span class="text-xs px-1.5 py-0.5 rounded ${b.status==='已认证'?'bg-success/10 text-success border border-success/30':'bg-warning/10 text-warning border border-warning/30'}">${b.status}</span></td>
      <td class="text-right pr-4"><a href="#" onclick="viewGB('${b.id}');return false" class="text-xs text-brand-600 hover:underline">详情 →</a></td>
    </tr>
  `).join('');
  return `
    <!-- 数据来源 / 演示性质声明 -->
        <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
          <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span><strong class="text-ink">数据声明：</strong>本页面"主体名称、统一社会信用代码、注册地址、法定代表人、注册资本、上市状态、行业类别"等<strong>事实型字段</strong> 100% 来自公开资料（国家企业信用信息公示系统 / 上市公司年报 / 信用中国 / 企业官网 / 远东资信公开评级报告）；"信用等级、KPI、流水编号、调用次数、订阅时间、扣分事件、PD / LGD 调整、合规命中"等<strong>运营字段</strong>为 CCASCEA 智能体演示数据，仅供产品功能展示。</span>
        </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            绿色债券评估认证
            <span class="text-xs text-muted font-normal">远东定制化业务 · 第三方评估认证</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            依据《绿色债券原则》(GBP) 2021、气候债券标准 CBI v3.1、《人民银行绿色债券支持项目目录(2021版)》，
            对发行人主体绿色化程度、募集资金投向、项目环境效益、信息披露质量四维度进行第三方评估认证，
            出具绿色等级（G-1 / G-2 / G-3）。
          </p>
        </div>
        <button onclick="askAIGB()" class="text-xs px-3 py-1.5 grad-deep-blue text-white rounded-md hover:opacity-90">AI 助手</button>
      </div>

      <!-- KPI -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">已认证累计</div><div class="num text-2xl font-bold text-brand-600 mt-1">${stat.totalCertified}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">累计金额（亿元）</div><div class="num text-2xl font-bold text-brand-700 mt-1">${stat.totalAmount}</div></div>
        <div class="border border-border rounded-md p-3 bg-success/5"><div class="text-xs text-success">G-1（最佳）</div><div class="num text-2xl font-bold text-success mt-1">${stat.gLevelG1}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">G-2</div><div class="num text-2xl font-bold text-warning mt-1">${stat.gLevelG2}</div></div>
        <div class="border border-border rounded-md p-3"><div class="text-xs text-muted">G-3</div><div class="num text-2xl font-bold text-muted mt-1">${stat.gLevelG3}</div></div>
      </div>
    </section>

    <!-- 4 维度评估 -->
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
        <span class="w-1 h-4 bg-brand-600 rounded"></span>
        4 维度评估框架
      </h3>
      <div class="grid grid-cols-4 gap-3 text-xs">
        ${[
          ['① 发行人主体绿色化', '主体ESG表现 · 绿色战略 · 绿色治理 · 减排目标'],
          ['② 募集资金投向', '是否符合 GBP 2021 / 人行绿色目录的合格项目类别'],
          ['③ 项目环境效益', '碳减排、节能、节水、污染减排等环境效益量化测算'],
          ['④ 信息披露与透明度', '资金使用透明度、定期披露、第三方核证机制']
        ].map(([t, d]) => `
          <div class="border border-border rounded-lg p-4 hover:border-brand-300">
            <div class="text-sm font-medium text-brand-700">${t}</div>
            <div class="text-xs text-muted leading-snug mt-2">${d}</div>
          </div>
        `).join('')}
      </div>
    </section>

    <!-- 行业分布 + 绿色等级 -->
    <section class="grid grid-cols-2 gap-5 mb-5">
      <div class="bg-white rounded-lg shadow-card p-5">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          投向类别分布
        </h3>
        <div id="gb-chart" class="h-72"></div>
      </div>
      <div class="bg-white rounded-lg shadow-card p-5">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          绿色等级释义
        </h3>
        <div class="space-y-3 text-xs">
          <div class="border border-success/30 bg-success/5 rounded p-3">
            <div class="font-semibold text-success">G-1（最佳）</div>
            <div class="text-muted leading-relaxed mt-1">100% 募集资金用于合格绿色项目；信息披露完整；环境效益量化清晰；第三方持续核证。</div>
          </div>
          <div class="border border-warning/30 bg-warning/5 rounded p-3">
            <div class="font-semibold text-warning">G-2</div>
            <div class="text-muted leading-relaxed mt-1">≥ 80% 用于合格绿色项目；环境效益部分量化；定期披露较完整。</div>
          </div>
          <div class="border border-border bg-bg/40 rounded p-3">
            <div class="font-semibold">G-3</div>
            <div class="text-muted leading-relaxed mt-1">≥ 50% 用于合格绿色项目；披露存在改进空间，建议提升。</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 已认证绿债清单 -->
    <section class="bg-white rounded-lg shadow-card">
      <div class="px-5 py-3 border-b border-border flex items-center justify-between">
        <h3 class="text-sm font-semibold flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          已认证绿色债券清单
        </h3>
        <button onclick="newGB()" class="text-xs px-3 py-1 bg-brand-600 text-white rounded hover:bg-brand-700">+ 新建评估</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="th text-left">
            <th class="px-4 py-2">编号</th>
            <th class="py-2">发行人</th>
            <th class="py-2">债券名称</th>
            <th class="py-2 text-right pr-2">金额</th>
            <th class="py-2">期限</th>
            <th class="py-2">遵循原则</th>
            <th class="py-2">资金用途</th>
            <th class="py-2">信用等级</th>
            <th class="py-2">绿色等级</th>
            <th class="py-2">状态</th>
            <th class="py-2 pr-4 text-right">操作</th>
          </tr></thead>
          <tbody class="divide-y divide-border">${rows}</tbody>
        </table>
      </div>
    </section>
  `;
}

function initChart() {
  const el = document.getElementById('gb-chart');
  if (!el) return;
  const c = echarts.init(el);
  c.setOption({
    tooltip: { trigger:'item' },
    legend: { type:'scroll', textStyle:{ color:'#64748B', fontSize:11 }, bottom:0 },
    series: [{
      type:'pie', radius:['40%','70%'],
      label:{ color:'#1E293B', fontSize:10 },
      data: MockData.greenBondStats.byCategory.map(c => ({ name: c.name, value: c.cnt }))
    }]
  });
  window.addEventListener('resize', () => c.resize());
}

function viewGB(id) {
  const b = MockData.greenBonds.find(x => x.id === id);
  if (!b) return;
  openModal({
    title: b.bondName,
    width: 'max-w-2xl',
    content: `
      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div><span class="text-muted">发行人：</span>${b.issuer}</div>
          <div><span class="text-muted">编号：</span><span class="num">${b.id}</span></div>
          <div><span class="text-muted">金额：</span><span class="num">¥${b.amount} 亿</span></div>
          <div><span class="text-muted">期限：</span><span class="num">${b.duration} 年</span></div>
          <div><span class="text-muted">信用等级：</span>${b.rating !== '—' ? gradeBadge(b.rating) : '认证中'}</div>
          <div><span class="text-muted">绿色等级：</span>${b.greenLevel !== '—' ? `<span class="px-1.5 py-0.5 rounded bg-success/10 text-success">${b.greenLevel}</span>` : '认证中'}</div>
        </div>
        <div class="border-t border-border pt-3">
          <div class="font-medium mb-1 text-xs">遵循原则</div>
          <div class="text-xs text-muted">${b.principle}</div>
        </div>
        <div class="border-t border-border pt-3">
          <div class="font-medium mb-1 text-xs">资金投向</div>
          <ul class="text-xs space-y-1">${b.usage.map(u => `<li>· ${u}</li>`).join('')}</ul>
        </div>
        <div class="border-t border-border pt-3 text-[11px] text-muted leading-relaxed">
          <strong>合规说明：</strong>本评估认证遵循《绿色债券评估认证方法 V01》（远东评级标准委员会 2023-12-18 通过），
          并按 GBP 2021 / CBI v3.1 / 人行绿色目录三标双对齐。
        </div>
      </div>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded">关闭</button>
      <button onclick="closeModal();toast('认证报告已下载','success');" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded">下载报告</button>
    `
  });
}

function newGB() { toast('绿色债券评估申请表已发送至客户邮箱', 'info'); }

function askAIGB() {
  AIAgent.setScene('kb-rag');
  const list = (window.MockData && MockData.greenBonds) || [];
  const ctx = list.slice(0, 6).map(b => '· ' + b.id + ' · ' + b.subject + ' · 募投=' + b.useOfProceeds + ' · 当前认证=' + (b.grade || '待评') + ' · 募集 ' + (b.amount || '—') + ' 亿').join('\n');
  AIAgent.send(
    '请基于本平台在评的绿色债券组合，给出"项目逐单认证建议 + 共性风险预警 + 监管披露要点"三段式专业意见。\n' +
    '当前绿色债券（节选）：\n' + (ctx || '（暂无数据）') + '\n\n' +
    '要求：\n' +
    '1. 按 GBP 2021 / CBI v3.1 / 人行绿色目录(2021版) 四维度（募集资金用途 / 项目评估筛选 / 募集资金管理 / 报告披露），逐单建议 G-1 / G-2 / G-3 等级；\n' +
    '2. 识别 3 个最易触发"洗绿"质疑的共性风险点（如目录边缘行业、披露不及时）；\n' +
    '3. 与人行《绿色金融评价方案》监管口径的差异点；\n' +
    '4. 第三方鉴证机构选择的合规建议（独立性 / 资质 / 披露范围）；\n' +
    '5. 给发行人的"绿色债券存续期信息披露"年度日历模板。',
    ctx
  );
}

mountLayout('green-bond', renderMain);
setTimeout(initChart, 50);
</script>
</body>
</html>
