<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>信评委工作台 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js?v=20260505i"></script>
<link rel="stylesheet" href="../assets/css/theme.css?v=20260505i" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/config.js?v=20260505i"></script>
<script src="../assets/js/mock-data.js?v=20260505i"></script>
<script src="../assets/js/copy-corpus.js?v=20260505i"></script>
<script src="../assets/js/common.js?v=20260505i"></script>
<script src="../assets/js/layout.js?v=20260505i"></script>
<script src="../assets/js/prompts.js?v=20260505i"></script>
<script src="../assets/js/ai-agent.js?v=20260505i"></script>
<script>
/* ============== 信评委工作台（FR-G-002）============== */
function renderMain() {
  const t = MockData.committeeAgendaToday;
  const items = MockData.committeeAgenda;
  const members = MockData.committeeMembers;
  return `
    <!-- 数据来源 / 演示性质声明 -->
        <div class="bg-bg/60 border border-border rounded-md px-4 py-2 mb-4 text-[11px] text-muted leading-relaxed flex items-start gap-2">
          <svg class="w-3.5 h-3.5 text-brand-600 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span><strong class="text-ink">数据声明：</strong>本页面"主体名称、统一社会信用代码、注册地址、法定代表人、注册资本、上市状态、行业类别"等<strong>事实型字段</strong> 100% 来自公开资料（国家企业信用信息公示系统 / 上市公司年报 / 信用中国 / 企业官网 / 远东资信公开评级报告）；"信用等级、KPI、流水编号、调用次数、订阅时间、扣分事件、PD / LGD 调整、合规命中"等<strong>运营字段</strong>为 CCASCEA 智能体演示数据，仅供产品功能展示。</span>
        </div>

    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            信评委工作台
            <span class="text-xs text-muted font-normal">FR-G-002 · 信评委专属入口</span>
          </h1>
          <p class="text-xs text-muted mt-2 leading-relaxed">
            议程列表、资料包预览、电子投票、决议留痕。委员通过 U 盾 / 证书签名完成表决。
            按《信用评审委员会制度》：参会 ≥ 5 人，2/3 以上同意有效，回避机制自动生效。
          </p>
        </div>
        <div class="flex items-center gap-2">
          <a href="committee-agenda.html" class="text-xs px-3 py-1.5 border border-border rounded-md hover:bg-bg">议程包详情</a>
          <a href="committee-vote.html" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700">进入投票 →</a>
        </div>
      </div>
    </section>

    <!-- 当前会议 -->
    <section class="grad-deep-blue text-white rounded-lg p-5 mb-5">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-lg bg-white/15 flex items-center justify-center">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M17 20h5v-2a3 3 0 00-5.36-1.85M17 20H7m10 0v-2c0-.66-.13-1.3-.37-1.88M7 20H2v-2a3 3 0 015.36-1.85M7 20v-2c0-.66.13-1.3.37-1.88m11.26-3a3 3 0 10-5.26 0M9.63 13a3 3 0 10-5.26 0M14.5 7.5a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </div>
        <div class="flex-1">
          <div class="text-xs opacity-80">本期信评委会议</div>
          <div class="text-2xl font-bold mt-1">${t.sessionId}</div>
          <div class="text-sm opacity-90 mt-1">${t.when} · ${t.location}</div>
        </div>
        <div class="text-right">
          <div class="text-xs opacity-80">议项</div>
          <div class="text-3xl font-bold num">${t.items}</div>
          <div class="text-xs opacity-80 mt-1">委员 ${t.members} 人 · 主席 ${t.chair}</div>
        </div>
      </div>
    </section>

    <!-- 议项三连卡 -->
    <section class="grid grid-cols-3 gap-5 mb-5">
      ${items.map(it => {
        const danger = it.publicGrade === 'D';
        return `
          <div class="bg-white rounded-lg shadow-card p-5 ${danger?'border-2 border-danger':''}">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs num text-muted">${it.id}</span>
              <span class="text-xs px-1.5 py-0.5 rounded ${it.risk==='高'?'bg-danger/10 text-danger border border-danger/30':it.risk==='中'?'bg-warning/10 text-warning border border-warning/30':'bg-success/10 text-success border border-success/30'}">${it.risk} 风险</span>
            </div>
            <div class="text-sm font-semibold leading-tight">${it.subject}</div>
            <div class="text-xs text-muted mt-1">${it.type}</div>
            <div class="grid grid-cols-2 gap-2 mt-3">
              <div class="border border-border rounded p-2 text-center">
                <div class="text-[10px] text-muted">拟定等级</div>
                <div class="mt-1">${gradeBadge(it.proposedGrade)}</div>
              </div>
              <div class="border border-border rounded p-2 text-center">
                <div class="text-[10px] text-muted">公共信用</div>
                <div class="mt-1">${publicGradeBadge(it.publicGrade)}</div>
              </div>
            </div>
            ${danger?'<div class="mt-2 p-2 bg-danger/5 border border-danger/30 rounded text-[10px] text-danger leading-snug">⚠ 触发 D 级红线 · 强制 ≤ BBB-</div>':''}
            <div class="text-xs text-ink/85 leading-snug mt-2">${it.focus}</div>
            <div class="flex gap-2 mt-3">
              <button onclick="viewItem('${it.id}')" class="text-xs px-2 py-1 border border-border rounded hover:bg-bg flex-1">议程包</button>
              <a href="committee-vote.html?id=${it.id}" class="text-xs px-2 py-1 bg-brand-600 text-white rounded hover:bg-brand-700 flex-1 text-center">投票</a>
            </div>
          </div>
        `;
      }).join('')}
    </section>

    <!-- 委员列表 + 我的待办 -->
    <section class="grid grid-cols-3 gap-5">
      <div class="col-span-2 bg-white rounded-lg shadow-card">
        <div class="px-5 py-3 border-b border-border">
          <h3 class="text-sm font-semibold flex items-center gap-2">
            <span class="w-1 h-4 bg-brand-600 rounded"></span>
            参会委员（${members.length}）
          </h3>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="th text-left">
            <th class="px-4 py-2">委员</th>
            <th class="py-2">角色</th>
            <th class="py-2">部门</th>
            <th class="py-2">状态</th>
            <th class="py-2">回避项目</th>
          </tr></thead>
          <tbody class="divide-y divide-border">
            ${members.map(m => `
              <tr class="hover:bg-bg ${m.recused?'opacity-60':''}">
                <td class="px-4 py-2.5 text-sm font-medium">${m.name}</td>
                <td class="text-xs">${m.role}</td>
                <td class="text-xs text-muted">${m.dept}</td>
                <td class="text-xs ${m.recused?'text-warning':m.signed?'text-success':'text-muted'}">${m.recused?'已回避':m.signed?'已签字':'参会中'}</td>
                <td class="text-xs num text-muted">${m.recusedFor || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="bg-white rounded-lg shadow-card p-5">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-3">
          <span class="w-1 h-4 bg-brand-600 rounded"></span>
          我的待办
        </h3>
        <ul class="space-y-3 text-xs">
          <li class="border border-border rounded p-3 hover:border-brand-300">
            <div class="flex items-center gap-2"><span class="px-1.5 py-0.5 bg-warning/10 text-warning rounded text-[10px]">3 个议项</span><span class="text-muted">2026-04-29 14:00 前完成投票</span></div>
            <div class="font-medium mt-1">CC-2026-018 信评委审议</div>
          </li>
          <li class="border border-border rounded p-3 hover:border-brand-300">
            <div class="text-muted">2026-04-30 截止</div>
            <div class="font-medium mt-1">复评议项 AP-2026-003 阅读议程包</div>
          </li>
          <li class="border border-border rounded p-3 hover:border-brand-300">
            <div class="text-muted">2026-05-04</div>
            <div class="font-medium mt-1">月度信评委质量回顾</div>
          </li>
        </ul>
      </div>
    </section>
  `;
}

function viewItem(id) {
  const it = MockData.committeeAgenda.find(x => x.id === id);
  if (!it) return;
  openModal({
    title: '议程包：' + it.id + ' · ' + it.subject,
    width: 'max-w-3xl',
    content: `
      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-3 gap-3">
          <div><span class="text-xs text-muted">拟定等级</span><div class="mt-1">${gradeBadge(it.proposedGrade, { large:true })}</div></div>
          <div><span class="text-xs text-muted">公共信用</span><div class="mt-1">${publicGradeBadge(it.publicGrade, { large:true })}</div></div>
          <div><span class="text-xs text-muted">风险</span><div class="text-xl font-bold ${it.risk==='高'?'text-danger':'text-warning'} mt-1">${it.risk}</div></div>
        </div>
        <div class="border-t border-border pt-3">
          <div class="text-xs font-medium mb-1">关键关注点</div>
          <div class="text-xs text-muted leading-relaxed">${it.focus}</div>
        </div>
        <div class="border-t border-border pt-3 text-[11px] text-muted leading-relaxed">
          完整议程包（218 页）已生成，包含：评级建议、关键证据、负面记录、公共信用摘要、对比同业、ESG 摘要等。
          点击下方按钮跳转到投票页面进行表决。
        </div>
      </div>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded">关闭</button>
      <a href="committee-vote.html?id=${it.id}" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded hover:bg-brand-700">进入投票</a>
    `
  });
}

mountLayout('committee-workbench', renderMain);
</script>
</body>
</html>
