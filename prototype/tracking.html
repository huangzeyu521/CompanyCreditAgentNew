<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>跟踪评级 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
function renderMain() {
  const subs = MockData.trackingSubscriptions;
  const alerts = [
    { level: 'red',    icon: '🔴', title: 'D级熔断警报',  subject: '华东建材有限公司',     desc: '触发"严重失信主体名单"，市场化评级被强制锁定 ≤ B级', time: '2026-04-28 14:32' },
    { level: 'yellow', icon: '🟡', title: '公共信用变动',  subject: 'XX 科技股份有限公司',  desc: '公共信用由 B → C，需评估对融合等级影响',           time: '2026-04-28 11:08' },
    { level: 'blue',   icon: '🔵', title: '关联传染预警',  subject: 'XX 集团子公司',         desc: '出现司法失信信息，R_total 提升 +18%',                time: '2026-04-27 18:42' },
    { level: 'yellow', icon: '🟡', title: '行政处罚新增',  subject: 'XX 房地产开发有限公司', desc: '新增土地增值税违规处罚，扣分 80',                    time: '2026-04-26 09:15' },
    { level: 'blue',   icon: '🔵', title: '信用修复完成',  subject: 'XX 物流股份有限公司',   desc: '完成欠税修复，等级回调 +0.5 子级',                  time: '2026-04-25 16:30' }
  ];

  const colorMap = {
    red:    { border:'border-danger',  bg:'bg-danger/5',   title:'text-danger',  btn:'text-danger' },
    yellow: { border:'border-warning', bg:'bg-warning/5',  title:'text-warning', btn:'text-warning' },
    blue:   { border:'border-accent',  bg:'bg-brand-50',   title:'text-brand-600',btn:'text-brand-600' }
  };

  return `
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <div class="flex items-start justify-between mb-4 flex-wrap gap-3">
        <div>
          <h1 class="text-lg font-semibold flex items-center gap-2">
            <span class="w-1 h-5 bg-brand-600 rounded"></span>
            跟踪评级 · 实时预警与订阅管理
          </h1>
          <p class="text-sm text-muted mt-1">智能体每日持续监听已订阅主体在公共信用平台的更新，关键事件秒级感知。</p>
        </div>
        <button onclick="addSubscription()" class="text-xs px-3 py-1.5 bg-brand-600 text-white rounded-md hover:bg-brand-700">+ 添加订阅</button>
      </div>

      <!-- 概览 KPI + 本周预警趋势图 -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-5">
        <div class="lg:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="border border-border rounded p-3"><div class="text-xs text-muted">订阅主体</div><div class="num text-xl font-semibold text-brand-600 mt-1">${subs.length}</div></div>
          <div class="border border-border rounded p-3"><div class="text-xs text-muted">本周预警</div><div class="num text-xl font-semibold text-warning mt-1">${alerts.length}</div></div>
          <div class="border border-danger/30 rounded p-3 bg-danger/5"><div class="text-xs text-danger">熔断主体</div><div class="num text-xl font-semibold text-danger mt-1">1</div></div>
          <div class="border border-border rounded p-3"><div class="text-xs text-muted">本月已跟踪评级</div><div class="num text-xl font-semibold text-brand-600 mt-1">12</div></div>
          <div class="md:col-span-4 border border-border rounded p-3">
            <div class="text-xs font-semibold mb-2 flex items-center justify-between">
              <span>本周预警趋势 · 按级别</span>
              <span class="text-[10px] text-muted">最近 7 天</span>
            </div>
            <div id="alertTrendChart" class="h-40"></div>
          </div>
        </div>
        <div class="border border-border rounded p-3">
          <div class="text-xs font-semibold mb-2">预警级别分布</div>
          <div id="alertPieChart" class="h-48"></div>
        </div>
      </div>

      <!-- 订阅清单 -->
      <h2 class="text-sm font-semibold mb-2 flex items-center gap-2"><span class="w-1 h-4 bg-brand-600 rounded"></span>我的订阅主体（${subs.length}）</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        ${subs.map(s => `
          <div class="border border-border rounded-md p-3 hover:border-brand-300 lift">
            <div class="flex items-start justify-between">
              <div>
                <div class="text-sm font-medium">${s.name}</div>
                <div class="text-xs text-muted num">${s.uscc}</div>
              </div>
              ${s.alertCount > 0 ? `<span class="text-xs bg-danger/10 text-danger border border-danger/30 px-1.5 py-0.5 rounded">⚠ ${s.alertCount}</span>` : '<span class="text-xs text-success">✓</span>'}
            </div>
            <div class="text-[10px] text-muted mt-2">订阅于 ${s.subscribedAt}</div>
            <div class="mt-3 flex gap-1">
              <a href="subject-rating.html" class="text-xs text-brand-600 hover:underline">启动跟踪</a>
              <span class="text-border">|</span>
              <a href="#" onclick="toast('已取消订阅: ${s.name}','info')" class="text-xs text-muted hover:text-danger">取消订阅</a>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- 实时预警列表 -->
      <h2 class="text-sm font-semibold mb-2 flex items-center gap-2"><span class="w-1 h-4 bg-danger rounded"></span>实时预警（${alerts.length}）</h2>
      <div class="space-y-3">
        ${alerts.map(a => {
          const c = colorMap[a.level];
          return `
            <div class="border-l-4 ${c.border} ${c.bg} rounded p-3">
              <div class="flex items-start gap-3">
                <span class="text-base">${a.icon}</span>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <div class="text-xs ${c.title} font-semibold">${a.title}</div>
                    <div class="text-xs text-muted">·</div>
                    <div class="text-xs text-muted num">${a.time}</div>
                  </div>
                  <div class="text-sm font-medium mt-0.5">${a.subject}</div>
                  <div class="text-xs text-muted mt-1">${a.desc}</div>
                </div>
                <div class="flex gap-2 flex-shrink-0">
                  <a href="subject-rating.html?subject=${encodeURIComponent(a.subject)}" class="text-xs px-2.5 py-1 bg-brand-600 text-white rounded hover:bg-brand-700">启动评级</a>
                  <button onclick="toast('已忽略此预警','info')" class="text-xs px-2.5 py-1 border border-border text-muted rounded hover:bg-bg">忽略</button>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}
function addSubscription() {
  const opts = MockData.subjects.map(s => `<option value="${s.uscc}">${s.name}</option>`).join('');
  openModal({
    title: '+ 添加订阅主体',
    width: 'max-w-md',
    content: `
      <div class="space-y-4">
        <div>
          <label class="text-xs text-muted">选择主体</label>
          <select id="newSubUscc" class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option value="">请选择...</option>
            ${opts}
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">订阅事件类型（可多选）</label>
          <div class="mt-1 space-y-1.5">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked class="rounded border-border" />D级熔断警报（强制订阅）</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked class="rounded border-border" />公共信用等级变动</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked class="rounded border-border" />关联传染性预警</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded border-border" />行政处罚 / 司法失信</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded border-border" />ESG 重大事件</label>
          </div>
        </div>
        <div>
          <label class="text-xs text-muted">推送渠道</label>
          <div class="mt-1 flex gap-3 text-sm">
            <label class="flex items-center gap-1"><input type="checkbox" checked class="rounded border-border" />工作台</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="rounded border-border" />邮件</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="rounded border-border" />短信</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="rounded border-border" />钉钉</label>
          </div>
        </div>
      </div>
    `,
    footer: `
      <button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-border rounded hover:bg-bg">取消</button>
      <button onclick="confirmAddSub()" class="px-3 py-1.5 text-sm bg-brand-600 text-white rounded hover:bg-brand-700">确认订阅</button>
    `
  });
}
function confirmAddSub() {
  const sel = document.getElementById('newSubUscc').value;
  if (!sel) { toast('请选择主体', 'warning'); return; }
  closeModal();
  toast('订阅添加成功，已开启实时监听', 'success');
}
mountLayout('tracking', renderMain);

// 等 layout mount 完毕再 init 图表
setTimeout(() => {
  const trendEl = document.getElementById('alertTrendChart');
  if (trendEl) {
    const c = echarts.init(trendEl);
    c.setOption({
      tooltip: { trigger: 'axis' },
      legend: { data: ['🔴 红色', '🟡 黄色', '🔵 蓝色'], textStyle: { fontSize: 10 }, top: 0 },
      grid: { left: 35, right: 10, top: 25, bottom: 25 },
      xAxis: { type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日'], axisLine: { lineStyle: { color: '#CBD5E1' } } },
      yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: '#F1F5F9' } } },
      series: [
        { name: '🔴 红色', type: 'bar', stack: 'a', data: [0,1,0,2,1,0,0], itemStyle:{color:'#DC2626'}, barWidth: '50%' },
        { name: '🟡 黄色', type: 'bar', stack: 'a', data: [1,2,1,3,2,1,1], itemStyle:{color:'#F59E0B'} },
        { name: '🔵 蓝色', type: 'bar', stack: 'a', data: [2,3,2,4,3,2,1], itemStyle:{color:'#4A90E2'} }
      ]
    });
    window.addEventListener('resize', () => c.resize());
  }
  const pieEl = document.getElementById('alertPieChart');
  if (pieEl) {
    const c = echarts.init(pieEl);
    c.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
      legend: { orient: 'vertical', right: 0, top: 'middle', textStyle: { fontSize: 11 } },
      series: [{
        type: 'pie', radius: ['40%', '70%'], center: ['35%', '50%'],
        avoidLabelOverlap: true,
        label: { show: false },
        data: [
          { value: 1, name: '🔴 D级熔断', itemStyle:{color:'#DC2626'} },
          { value: 2, name: '🟡 信用变动', itemStyle:{color:'#F59E0B'} },
          { value: 2, name: '🔵 关联预警', itemStyle:{color:'#4A90E2'} }
        ]
      }]
    });
    window.addEventListener('resize', () => c.resize());
  }
}, 100);
</script>
</body>
</html>
