/* ============== 工具 ============== */
function getGradeBgClass(g) {
  if (['AAA','AA','A'].includes(g)) return 'bg-success/10 border border-success/30';
  if (['BBB','BB','B'].includes(g)) return 'bg-warning/10 border border-warning/30';
  if (['CCC','CC','C'].includes(g)) return 'bg-orange-100 border border-orange-300';
  if (g === 'D')                    return 'bg-danger/15 border border-danger/40';
  return 'bg-bg border border-border';
}
function getGradeColorClass(g) {
  if (['AAA','AA','A'].includes(g)) return 'text-success';
  if (['BBB','BB','B'].includes(g)) return 'text-warning';
  if (['CCC','CC','C'].includes(g)) return 'text-orange-600';
  if (g === 'D')                    return 'text-danger';
  return 'text-muted';
}
function getGradeSemantic(g) {
  return ({ AAA:'诚信模范',AA:'诚信优秀',A:'诚信',BBB:'基本诚信',BB:'诚信观察',B:'诚信警示',CCC:'基本失信',CC:'失信',C:'一般失信',D:'严重失信',NR:'未分级' })[g] || '';
}

/* ============== TOC scrollspy ============== */
const tocLinks = document.querySelectorAll('#toc a');
const sectionIds = ['sec-1','sec-2','sec-3','sec-4','sec-5','sec-6','sec-7','sec-8','sec-9','sec-10','sec-11','sec-12','sec-13','sec-14'];
const sections = sectionIds.map(id => document.getElementById(id)).filter(Boolean);
function activeToc(id) {
  tocLinks.forEach(a => {
    if (a.getAttribute('href') === '#' + id) {
      a.classList.add('toc-active'); a.classList.remove('toc-item','text-ink/80');
    } else {
      a.classList.remove('toc-active'); a.classList.add('toc-item','text-ink/80');
    }
  });
  const idx = sectionIds.indexOf(id);
  const pct = Math.round((idx+1) / sectionIds.length * 100);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('progPct').textContent = pct + '%';
}
window.addEventListener('scroll', () => {
  const y = window.scrollY + 200;
  let active = sections[0]?.id;
  for (const s of sections) if (s.offsetTop <= y) active = s.id;
  if (active) activeToc(active);
});
tocLinks.forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
}));
