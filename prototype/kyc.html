<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客户尽调 KYC · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
let _kycSubject = null;

function renderMain() {
  const opts = MockData.subjects.map(s => `<option value="${s.uscc}">${s.name}</option>`).join('');
  return `
    <section class="bg-white rounded-lg shadow-card p-6 mb-5">
      <h1 class="text-lg font-semibold flex items-center gap-2 mb-4">
        <span class="w-1 h-5 bg-brand-600 rounded"></span>
        客户尽调 KYC · 10秒快速画像
      </h1>
      <p class="text-sm text-muted mb-5">面向评级业务承接前的快速判断：是否存在 D 级熔断 / 担保链断裂 / 关联失信等高危风险。</p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="text-xs text-muted">输入主体名称或统一社会信用代码</label>
          <select id="kyc-select" onchange="doKyc(this.value)"
            class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option value="">请选择主体...</option>
            ${opts}
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="doKyc(document.getElementById('kyc-select').value)" class="w-full px-4 py-2 bg-brand-600 text-white rounded-md hover:bg-brand-700 text-sm">
            🔍 立即生成画像
          </button>
        </div>
      </div>
    </section>

    <div id="kyc-result"></div>
  `;
}

function doKyc(uscc) {
  if (!uscc) { toast('请先选择主体', 'warning'); return; }
  _kycSubject = MockData.subjects.find(s => s.uscc === uscc);
  if (!_kycSubject) { toast('未识别该主体', 'danger'); return; }
  renderResult();
  toast('画像已生成','success');
}

function renderResult() {
  const s = _kycSubject;
  if (!s) return;

  // 红黄绿判定
  let verdict = { color:'success', icon:'🟢', title:'建议承接', desc:'无重大失信记录，关联风险可控，可正常承接评级业务。', bg:'from-green-50 to-emerald-50', border:'border-success' };
  if (s.publicGrade === 'D' || s.fuseStatus === 'restricted') {
    verdict = { color:'danger', icon:'🔴', title:'不建议承接', desc:'已触发 D 级熔断，强烈不建议承接，可能违反国办发〔2026〕8号文合规要求。', bg:'from-red-50 to-pink-50', border:'border-danger' };
  } else if (['B','C'].includes(s.publicGrade) || s.fuseStatus === 'warning') {
    // 文档 6.2.1：公共信用仅 A/B/C/D 四级；B/C 即谨慎承接，A 可承接，D 不可承接
    verdict = { color:'warning', icon:'🟡', title:'谨慎承接', desc:'存在公共信用扣分项或关联风险，建议在合同中加入特殊条款，控制服务边界。', bg:'from-amber-50 to-yellow-50', border:'border-warning' };
  }

  const html = `
    <!-- 判定结果 -->
    <section class="bg-gradient-to-br ${verdict.bg} border-2 ${verdict.border} rounded-lg p-6 mb-5">
      <div class="flex items-start gap-4">
        <div class="text-4xl">${verdict.icon}</div>
        <div class="flex-1">
          <div class="text-xl font-bold text-${verdict.color}">${verdict.title}</div>
          <div class="text-sm text-ink/90 mt-1">${verdict.desc}</div>
          <div class="mt-3 flex gap-2">
            ${verdict.color === 'success' ? `<a href="subject-rating.html?subject=${encodeURIComponent(s.name)}" class="text-xs px-3 py-1.5 bg-success text-white rounded hover:bg-green-700">立即启动主体评级 →</a>` : ''}
            ${verdict.color === 'warning' ? `<a href="subject-rating.html?subject=${encodeURIComponent(s.name)}" class="text-xs px-3 py-1.5 bg-warning text-white rounded">在限制条件下承接 →</a>` : ''}
            ${verdict.color === 'danger' ? `<button onclick="toast('已记录拒接理由','info')" class="text-xs px-3 py-1.5 bg-danger text-white rounded hover:bg-red-700">记录拒接理由</button>` : ''}
            <button onclick="toast('已导出 KYC 报告','success')" class="text-xs px-3 py-1.5 border border-${verdict.color}/40 text-${verdict.color} rounded">导出 KYC 报告</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 4 KPI -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
      <div class="bg-white rounded-lg shadow-card p-4">
        <div class="text-xs text-muted">公共信用等级</div>
        <div class="mt-2">${gradeBadge(s.publicGrade, { large: true })}</div>
        <div class="text-xs text-muted mt-2">基于 GB/T 23794</div>
      </div>
      <div class="bg-white rounded-lg shadow-card p-4">
        <div class="text-xs text-muted">公共信用评分</div>
        <div class="num text-2xl font-bold ${s.publicScore >= 800 ? 'text-success' : s.publicScore >= 650 ? 'text-warning' : 'text-danger'} mt-1">${s.publicScore}<span class="text-sm text-muted">/1000</span></div>
        <div class="h-1 bg-bg rounded mt-3"><div class="h-full bg-brand-500 rounded" style="width:${s.publicScore/10}%"></div></div>
      </div>
      <div class="bg-white rounded-lg shadow-card p-4">
        <div class="text-xs text-muted">关联风险</div>
        <div class="text-base font-bold text-warning mt-1">中等</div>
        <div class="text-xs text-muted mt-1">R_total = 0.18</div>
      </div>
      <div class="bg-white rounded-lg shadow-card p-4">
        <div class="text-xs text-muted">熔断状态</div>
        <div class="text-base font-bold ${s.fuseStatus === 'restricted' ? 'text-danger' : s.fuseStatus === 'warning' ? 'text-warning' : 'text-success'} mt-1">
          ${s.fuseStatus === 'restricted' ? '已触发' : s.fuseStatus === 'warning' ? '观察中' : '正常'}
        </div>
        <div class="text-xs text-muted mt-1">最近校验：今日 14:32</div>
      </div>
    </section>

    <!-- 主体详情 -->
    <section class="bg-white rounded-lg shadow-card p-5 mb-5">
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="w-1 h-4 bg-brand-600 rounded"></span>主体基础信息</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <div><div class="text-xs text-muted">主体名称</div><div class="font-medium mt-1">${s.name}</div></div>
        <div><div class="text-xs text-muted">统一社会信用代码</div><div class="num font-medium mt-1">${s.uscc}</div></div>
        <div><div class="text-xs text-muted">行业</div><div class="font-medium mt-1">${s.industry}</div></div>
        <div><div class="text-xs text-muted">法定代表人</div><div class="font-medium mt-1">${s.legalRep || '—'}</div></div>
      </div>
    </section>
  `;
  document.getElementById('kyc-result').innerHTML = html;
}

mountLayout('kyc', renderMain);
</script>
</body>
</html>
