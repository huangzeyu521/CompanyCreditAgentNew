<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>债项评级 · CCASCEA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div id="app"></div>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
function renderMain() {
  return `
    <section class="bg-white rounded-lg shadow-card p-6 mb-5">
      <h1 class="text-lg font-semibold flex items-center gap-2 mb-4">
        <span class="w-1 h-5 bg-brand-600 rounded"></span>
        债项评级 · 在主体评级基础上叠加债项要素
      </h1>
      <p class="text-sm text-muted mb-5">本智能体自动将发行人在公共信用上的扣分项映射为债项的违约概率（PD）调整因子与违约损失率（LGD）调整因子。</p>

      <!-- 主体快照 -->
      <div class="border border-brand-100 bg-brand-50 rounded-md p-4 mb-5">
        <div class="text-xs text-brand-700 font-semibold mb-2">发行主体快照</div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs">
          <div><div class="text-muted">主体名称</div><div class="font-medium mt-1">XX 股份有限公司</div></div>
          <div><div class="text-muted">主体评级（远东）</div><div class="font-medium mt-1 num">AA-</div></div>
          <div><div class="text-muted">公共信用</div><div class="mt-1">${gradeBadge('B')}</div></div>
          <div><div class="text-muted">融合等级</div><div class="mt-1">${gradeBadge('A')}</div></div>
          <div><div class="text-muted">熔断状态</div><div class="font-medium mt-1 text-success">未触发</div></div>
        </div>
      </div>

      <!-- 债项要素录入 -->
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2">
        <span class="w-1 h-4 bg-brand-600 rounded"></span>
        债项要素录入
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
        <div>
          <label class="text-xs text-muted">债项编号 <span class="text-danger">*</span></label>
          <input value="2026-XXX-001" class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm" />
        </div>
        <div>
          <label class="text-xs text-muted">债项类型</label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option>公司债</option>
            <option>中期票据</option>
            <option>短期融资券</option>
            <option>定向工具 PPN</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">期限 / 余额（万元）</label>
          <input value="3年 / 50000" class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm" />
        </div>
        <div>
          <label class="text-xs text-muted">增信方式</label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option>无增信</option>
            <option selected>第三方担保</option>
            <option>抵押</option>
            <option>质押</option>
            <option>差额补足</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-muted">担保方</label>
          <input value="XX 集团有限公司" class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm" />
        </div>
        <div>
          <label class="text-xs text-muted">契约条款</label>
          <select class="mt-1 block w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:border-accent text-sm">
            <option>无特殊条款</option>
            <option selected>含交叉违约条款</option>
            <option>含财务承诺条款</option>
          </select>
        </div>
      </div>

      <!-- 增信效果分析 -->
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2">
        <span class="w-1 h-4 bg-brand-600 rounded"></span>
        增信效果分析（智能体辅助）
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
        <div class="border border-border rounded-md p-4">
          <div class="text-xs text-muted">担保方信用</div>
          <div class="mt-1">${gradeBadge('AA')}</div>
          <div class="text-xs text-muted mt-2">担保方公共信用：A 级（920分）</div>
        </div>
        <div class="border border-border rounded-md p-4">
          <div class="text-xs text-muted">担保覆盖率</div>
          <div class="num text-2xl font-bold text-brand-600 mt-1">120%</div>
          <div class="text-xs text-success mt-2">充分覆盖</div>
        </div>
        <div class="border border-border rounded-md p-4">
          <div class="text-xs text-muted">建议债项调整</div>
          <div class="text-base font-bold text-success mt-1">上调 1 个子级</div>
          <div class="text-xs text-muted mt-2">从 A 上调至 A+</div>
        </div>
      </div>

      <!-- 主体 vs 债项最终结论 -->
      <h2 class="text-sm font-semibold mb-3 flex items-center gap-2">
        <span class="w-1 h-4 bg-gold rounded"></span>
        最终结论
      </h2>
      <div class="grid grid-cols-3 gap-4 mb-5">
        <div class="border border-border rounded-lg p-4 text-center">
          <div class="text-xs text-muted mb-1">主体融合等级</div>
          <div class="text-2xl font-bold text-brand-700 num">A</div>
        </div>
        <div class="border border-border rounded-lg p-4 text-center">
          <div class="text-xs text-muted mb-1">担保增信</div>
          <div class="text-2xl font-bold text-success num">+1</div>
          <div class="text-xs text-muted">子级</div>
        </div>
        <div class="border-2 border-gold rounded-lg p-4 text-center bg-gradient-to-br from-yellow-50 to-amber-100 glow-gold">
          <div class="text-xs text-gold font-semibold mb-1">★ 债项最终等级 ★</div>
          <div class="text-3xl font-bold text-gold num">A+</div>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button onclick="toast('草稿已保存','success')" class="text-xs px-4 py-1.5 border border-border rounded-md hover:bg-bg">保存草稿</button>
        <button onclick="finishBond()" class="text-xs px-4 py-1.5 bg-success text-white rounded-md hover:bg-green-700">✓ 生成债项评级报告</button>
      </div>
    </section>
  `;
}

function finishBond() {
  toast('正在生成债项评级报告...','success');
  setTimeout(() => location.href = 'report-detail.html?id=R-20260426-003', 1200);
}

mountLayout('bond-rating', renderMain);
</script>
</body>
</html>
